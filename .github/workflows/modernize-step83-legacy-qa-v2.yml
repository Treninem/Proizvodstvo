name: Modernize Step 83 Legacy QA V2

on:
  push:
    paths:
      - '.github/workflows/modernize-step83-legacy-qa-v2.yml'

permissions:
  contents: write

jobs:
  modernize:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: '123456789:TEST_TOKEN_FOR_CI_ONLY'
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-modern-qa-v2'
      PUBLIC_BASE_URL: 'https://example.invalid'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Update legacy scenarios
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')

          for rel in ['scripts/flow_test.py', 'scripts/smoke_test.py']:
              p = root / rel
              s = p.read_text(encoding='utf-8')
              def cancel_repl(m):
                  args = m.group(1)
                  if args.count(',') >= 4 or 'reason=' in args:
                      return m.group(0)
                  return f'accounting.cancel_operation({args}, "QA: отмена ошибочной записи")'
              s = re.sub(r'accounting\.cancel_operation\(([^()\n]+)\)', cancel_repl, s)
              p.write_text(s, encoding='utf-8')

          p = root / 'scripts/flow_test.py'
          s = p.read_text(encoding='utf-8')
          s = s.replace('backup.suffix == ".zip"', 'backup.name.endswith(".zip.enc")')
          s = s.replace('repo.user_permissions_current_context(group_a, owner_id).get("setup")', 'repo.user_permissions_current_context(group_a, user_full).get("setup")')
          s = s.replace('repo.user_permissions_current_context(group_a, owner_id).get("export")', 'repo.user_permissions_current_context(group_a, user_full).get("export")')
          p.write_text(s, encoding='utf-8')

          p = root / 'scripts/smoke_test.py'
          s = p.read_text(encoding='utf-8')
          if 'import io\n' not in s:
              s = s.replace('import os\n', 'import io\nimport os\n', 1)
          s = s.replace(
              'accounting.change_operation_quantity(chat_id, chat_id, 777, int(last_prod_id), 12)',
              'accounting.change_operation_quantity(chat_id, chat_id, 777, int(last_prod_id), 12, "QA: исправление количества")',
          )
          s = s.replace('account_backup.suffix == ".zip"', 'account_backup.name.endswith(".zip.enc")')
          s = s.replace('full_backup.suffix == ".zip"', 'full_backup.name.endswith(".zip.enc")')
          s = s.replace(
              'with zipfile.ZipFile(account_backup) as zf:',
              'with zipfile.ZipFile(io.BytesIO(backups._decrypt_restore_bytes(account_backup.read_bytes(), account_backup.name))) as zf:',
          )
          p.write_text(s, encoding='utf-8')

          for rel in [
              'scripts/chat_visibility_test.py',
              'scripts/group_selection_modes_step51_test.py',
              'scripts/group_selection_step51_test.py',
              'scripts/group_single_selection_step50_test.py',
          ]:
              p = root / rel
              s = p.read_text(encoding='utf-8')
              if 'class WebAppInfo:' not in s:
                  insert = 'class WebAppInfo:\n    def __init__(self, url: str):\n        self.url = url\n\n    def model_dump(self):\n        return {"url": self.url}\n\n'
                  s = s.replace('class InlineKeyboardButton:\n', insert + 'class InlineKeyboardButton:\n', 1)
              s = s.replace(
                  'def __init__(self, text: str, callback_data: str | None = None):\n        self.text = text\n        self.callback_data = callback_data',
                  'def __init__(self, text: str, callback_data: str | None = None, web_app=None):\n        self.text = text\n        self.callback_data = callback_data\n        self.web_app = web_app',
              )
              s = s.replace(
                  'return {"text": self.text, "callback_data": self.callback_data}',
                  'return {"text": self.text, "callback_data": self.callback_data, "web_app": self.web_app.model_dump() if self.web_app else None}',
              )
              if 'aiogram_types.WebAppInfo = WebAppInfo' not in s:
                  s = s.replace('aiogram_types.InlineKeyboardButton = InlineKeyboardButton\n', 'aiogram_types.InlineKeyboardButton = InlineKeyboardButton\naiogram_types.WebAppInfo = WebAppInfo\n', 1)
              if rel == 'scripts/chat_visibility_test.py':
                  s = s.replace('assert "Группы" in kb_text', 'assert "Группы" not in kb_text')
              p.write_text(s, encoding='utf-8')

          p = root / 'scripts/report_targets_step38_test.py'
          p.write_text(p.read_text(encoding='utf-8').replace('Зафасовали Изделие 1 2000', 'Отгрузили Изделие 1 2000'), encoding='utf-8')
          PY
      - name: Verify updated scenarios
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test*.py' -v
          for f in \
            scripts/flow_test.py \
            scripts/smoke_test.py \
            scripts/chat_visibility_test.py \
            scripts/group_selection_modes_step51_test.py \
            scripts/group_selection_step51_test.py \
            scripts/group_single_selection_step50_test.py \
            scripts/report_targets_step38_test.py; do
            echo "===== $f ====="
            rm -rf "$BOT_DATA_DIR"; mkdir -p "$BOT_DATA_DIR"
            python "$f"
          done
      - name: Commit verified QA updates
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/modernize-step83-legacy-qa-v2.yml
          rm -f .github/workflows/modernize-step83-legacy-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'QA: update legacy scenarios for Step 83'
          git push origin HEAD:main
