name: Probe live Mini App E

on:
  push:
    paths:
      - '.github/workflows/probe-live-e.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe live Bothost
        id: probe
        shell: bash
        run: |
          set +e
          curl -sS --max-time 20 -D /tmp/headers.txt -o /tmp/mini.html 'https://procontrol.bothost.tech/mini?chat_id=-1001234567890&probe=e'
          mini_rc=$?
          asset=$(curl -sS --max-time 20 -o /tmp/app.js -w '%{http_code}' 'https://procontrol.bothost.tech/static/app-20260812e.js?probe=e' || echo 000)
          health=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' 'https://procontrol.bothost.tech/health' || echo 000)
          ready=$(curl -sS --max-time 20 -o /tmp/ready.json -w '%{http_code}' 'https://procontrol.bothost.tech/ready' || echo 000)
          version=$(awk 'BEGIN{IGNORECASE=1}/^x-mini-app-version:/{gsub("\r","");print $2}' /tmp/headers.txt | tail -1)
          ref=0
          grep -q 'app-20260812e.js?v=83-legacyscope' /tmp/mini.html && ref=1
          echo "mini_rc=$mini_rc asset=$asset health=$health ready=$ready version=$version ref=$ref"
          echo '--- headers ---'; grep -Ei '^(HTTP/|location:|x-mini-app-version:)' /tmp/headers.txt || true
          echo '--- health ---'; cat /tmp/health.json; echo
          echo '--- ready ---'; cat /tmp/ready.json; echo
          if [ "$mini_rc" = 0 ] && [ "$asset" = 200 ] && [ "$health" = 200 ] && [ "$ready" = 200 ] && [ "$version" = 20260812e ] && [ "$ref" = 1 ]; then echo 'ok=1' >> "$GITHUB_OUTPUT"; else echo 'ok=0' >> "$GITHUB_OUTPUT"; fi
      - name: Cleanup successful probe
        if: steps.probe.outputs.ok == '1'
        shell: bash
        run: |
          rm -f .github/workflows/probe-live-e.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'CI: confirm live Mini App 20260812e'
          git push origin HEAD:main
      - name: Require E deployment
        if: steps.probe.outputs.ok != '1'
        run: exit 1
