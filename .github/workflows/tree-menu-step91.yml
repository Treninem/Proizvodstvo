name: Tree Mini App Step91

on:
  push:
    branches: [main]
    paths:
      - 'app/runtime.py'
      - 'app/services/frontend_runtime.py'
      - 'app/services/measurement_units.py'
      - 'webapp/tree_extensions.py'
      - 'webapp/tree_compat.py'
      - 'webapp/static/tree-shell.js'
      - 'webapp/static/tree-shell.css'
      - 'webapp/static/tree-help.js'
      - 'webapp/static/tree-refinement.js'
      - 'tests/test_step91_tree_menu.py'
      - '.github/workflows/tree-menu-step91.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-step91'
      PUBLIC_BASE_URL: 'https://procontrol.bothost.tech'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
      TRUSTED_HOSTS: ''
      CORS_ALLOWED_ORIGINS: ''
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set synthetic bot token
        shell: bash
        run: echo 'BOT_TOKEN=123456789:'"$(printf 'A%.0s' {1..30})" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-audit.txt
          python -m pip check
      - name: Compile Python
        run: python -m compileall -q app webapp tests scripts
      - name: Check Python correctness
        run: ruff check app webapp tests/test_step91_tree_menu.py --select F --output-format concise
      - name: Check tree JavaScript
        run: |
          node --check webapp/static/tree-shell.js
          node --check webapp/static/tree-help.js
          node --check webapp/static/tree-refinement.js
      - name: Run all unit regressions
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Audit Mini App and system wiring
        run: |
          python scripts/ui_wiring_audit_step84.py
          python scripts/full_system_audit_step83.py
          python scripts/security_audit.py
          python scripts/ui_text_audit.py
          python scripts/final_audit.py
          python scripts/flow_test.py
          python scripts/smoke_test.py
      - name: Verify tree extensions register
        run: |
          python - <<'PY'
          from webapp.extensions import install_extensions
          from webapp.tree_extensions import install_tree_extensions
          from webapp.tree_compat import install_tree_compat
          from webapp.server import app
          install_extensions(); install_tree_extensions(); install_tree_compat()
          routes={(r.path, tuple(sorted(getattr(r,'methods',set()) or set()))) for r in app.routes}
          required={'/api/tree/snapshot','/api/tree/units','/api/tree/entities/batch','/api/tree/worker/assign','/api/tree/composition','/api/tree/health','/api/extensions/area'}
          paths={path for path,_ in routes}
          missing=sorted(required-paths)
          if missing: raise SystemExit('missing routes: '+', '.join(missing))
          print('TREE_ROUTES_OK')
          PY
      - name: Check live tree deployment if available
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request
          base='https://procontrol.bothost.tech'
          last=''
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(base+'/api/tree/health',timeout=12) as response:
                      data=json.loads(response.read().decode('utf-8'))
                  req=urllib.request.Request(base+'/mini',headers={'Cache-Control':'no-cache','User-Agent':'Step91-tree-check'})
                  with urllib.request.urlopen(req,timeout=12) as response:
                      html=response.read().decode('utf-8')
                  ready=(
                      data.get('tree_menu')
                      and '/static/tree-shell.js?v=20260820c' in html
                      and '/static/tree-refinement.js?v=20260820c' in html
                  )
                  if ready:
                      print('LIVE_TREE_STEP91_OK')
                      raise SystemExit(0)
                  last=f'health={data}, shell={"/static/tree-shell.js?v=20260820c" in html}, refinement={"/static/tree-refinement.js?v=20260820c" in html}'
              except Exception as exc:
                  last=str(exc)
              if attempt < 11: time.sleep(10)
          raise SystemExit('LIVE_TREE_STEP91_NOT_DEPLOYED: '+last)
          PY
