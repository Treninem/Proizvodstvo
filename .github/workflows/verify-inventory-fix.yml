name: Verify Inventory Fix

on:
  push:
    paths:
      - '.github/workflows/verify-inventory-fix.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: '123456789:TEST_TOKEN_FOR_CI_ONLY'
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-inventory-fix'
      PUBLIC_BASE_URL: 'https://example.invalid'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run Step 83 tests and group filter regression
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_step83_regressions.py' -v
          rm -rf "$BOT_DATA_DIR"; mkdir -p "$BOT_DATA_DIR"
          python scripts/group_conversation_filter_step57_test.py
      - name: Cleanup one-shot workflow
        if: always()
        run: |
          rm -f .github/workflows/verify-inventory-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'CI: remove inventory fix verifier'
            git push origin HEAD:main
          fi
