name: Fix all split tenant scopes Step83

on:
  push:
    paths:
      - '.github/workflows/fix-all-scope-split-step83.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: '123456789:TEST_TOKEN_FOR_CI_ONLY'
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-scope-fix'
      PUBLIC_BASE_URL: 'https://example.invalid'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Apply canonical scope patch
        run: python scripts/apply_scope_unification_step83.py
      - name: Verify all scope paths and full QA
        shell: bash
        run: |
          set -euo pipefail
          node --check webapp/static/app-20260812f.js
          python -m compileall -q app webapp scripts main.py
          python -m unittest discover -s tests -p 'test*.py' -v
          python scripts/security_audit.py
          python scripts/final_audit.py
          python scripts/flow_test.py
          python scripts/smoke_test.py
          python scripts/chat_visibility_test.py
          python scripts/group_conversation_filter_step57_test.py
          grep -q 'MINI_UI_VERSION = "20260812f"' app/keyboards.py
          grep -q 'MINI_UI_VERSION = "20260812f"' webapp/server.py
          grep -q 'app-20260812f.js?v=83-canonicalscope' webapp/static/index.html
          ! grep -q '_GROUP_SCOPE_DATA_TABLES' app/services/repository.py
      - name: Commit verified canonical scope fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-all-scope-split-step83.yml .github/workflows/audit-all-scope-tables-step83.yml scripts/apply_scope_unification_step83.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unify all tenant data in canonical account scope'
          git push origin HEAD:main
