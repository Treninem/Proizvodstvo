name: Fix all split tenant scopes Step83

on:
  push:
    paths:
      - '.github/workflows/fix-all-scope-split-step83.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: '123456789:TEST_TOKEN_FOR_CI_ONLY'
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-scope-fix'
      PUBLIC_BASE_URL: 'https://example.invalid'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Apply canonical tenant scope migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('app/services/repository.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('_GROUP_SCOPE_DATA_TABLES = (')
          end=s.index('def ensure_group_account_context', start)
          new=r'''_SCOPE_ROUTING_OR_TRANSIENT_TABLES = frozenset({
              # These chat_id columns identify Telegram/routing/session context, not
              # tenant-owned business rows. They must never be mass-moved between scopes.
              "account_chat_access", "chat_active_account", "chat_area_bindings", "chats",
              "group_set_items", "setup_sessions", "pending_confirmations",
          })


def _tenant_scope_tables_from_conn(conn) -> tuple[str, ...]:
              """Discover every persistent table whose chat_id is a tenant scope.

              This is intentionally schema-driven: future Step84+ tables with chat_id are
              included automatically unless they are explicitly routing/transient tables.
              """
              out: list[str] = []
              rows = conn.execute(
                  "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name"
              ).fetchall()
              for row in rows:
                  name = str(row[0])
                  if name in _SCOPE_ROUTING_OR_TRANSIENT_TABLES:
                      continue
                  quoted = name.replace('"', '""')
                  columns = conn.execute(f'PRAGMA table_info("{quoted}")').fetchall()
                  if any(str(col[1]) == "chat_id" for col in columns):
                      out.append(name)
              return tuple(out)


def tenant_scope_tables() -> tuple[str, ...]:
              with db.connect() as conn:
                  return _tenant_scope_tables_from_conn(conn)


def _scope_business_row_count(chat_id: int) -> int:
              """Count all tenant-owned rows, including every current/future chat_id table."""
              total = 0
              with db.connect() as conn:
                  for table in _tenant_scope_tables_from_conn(conn):
                      quoted = table.replace('"', '""')
                      row = conn.execute(f'SELECT COUNT(*) FROM "{quoted}" WHERE chat_id=?', (int(chat_id),)).fetchone()
                      total += int(row[0] if row else 0)
              return total


def _canonical_account_scope(account: AccountingAccount) -> int:
              # create_account() has always reserved this deterministic private tenant id.
              return -900000000000 - int(account.id)


def _merge_group_scope_into_canonical(account: AccountingAccount, group_chat_id: int) -> AccountingAccount:
              """Unify legacy group rows and newer split-scope rows in one private scope.

              The whole migration is one SQLite transaction. Any uniqueness/FK conflict
              rolls everything back, so a partially migrated tenant is impossible.
              """
              group_chat_id = int(group_chat_id)
              canonical = _canonical_account_scope(account)
              if group_chat_id == canonical:
                  return account
              if int(account.scope_chat_id) not in {group_chat_id, canonical}:
                  return account
              occupied = db.fetchone(
                  "SELECT id FROM accounting_accounts WHERE scope_chat_id=? AND id<>? AND is_archived=0",
                  (canonical, int(account.id)),
              )
              if occupied:
                  return account
              try:
                  with db.connect() as conn:
                      conn.execute("PRAGMA foreign_keys=ON")
                      conn.execute("BEGIN IMMEDIATE")
                      conn.execute(
                          "INSERT OR IGNORE INTO chats(chat_id,title,chat_type,is_connected) VALUES(?,?,?,1)",
                          (canonical, f"Учёт: {account.name}", "account"),
                      )
                      tables = _tenant_scope_tables_from_conn(conn)
                      for table in tables:
                          quoted = table.replace('"', '""')
                          conn.execute(f'UPDATE "{quoted}" SET chat_id=? WHERE chat_id=?', (canonical, group_chat_id))
                      conn.execute(
                          "UPDATE accounting_accounts SET scope_chat_id=? WHERE id=?",
                          (canonical, int(account.id)),
                      )
                      fk = conn.execute("PRAGMA foreign_key_check").fetchall()
                      if fk:
                          raise RuntimeError(f"foreign key check failed: {len(fk)}")
                      conn.commit()
                  repaired = get_account_by_id(int(account.id))
                  return repaired or account
              except Exception as exc:
                  # Never hide a blocked migration: record it without exposing tenant data.
                  try:
                      db.execute(
                          "INSERT INTO security_events(chat_id,user_id,event_type,details) VALUES(?,?,?,?)",
                          (group_chat_id, int(account.owner_user_id), "scope_merge_blocked", str(exc)[:500]),
                      )
                  except Exception:
                      pass
                  return account


def _repair_empty_account_scope_from_group(account: AccountingAccount, group_chat_id: int) -> AccountingAccount:
              """Compatibility wrapper: canonicalize all split legacy/new tenant data."""
              return _merge_group_scope_into_canonical(account, int(group_chat_id))


'''
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')

          # Version bump so Telegram Web cannot reuse a stale immutable asset.
          src=Path('webapp/static/app-20260812e.js')
          dst=Path('webapp/static/app-20260812f.js')
          js=src.read_text(encoding='utf-8').replace('const MINI_APP_VERSION="20260812e";','const MINI_APP_VERSION="20260812f";',1)
          dst.write_text(js,encoding='utf-8')
          idx=Path('webapp/static/index.html')
          x=idx.read_text(encoding='utf-8').replace('/static/app-20260812e.js?v=83-legacyscope','/static/app-20260812f.js?v=83-canonicalscope',1)
          idx.write_text(x,encoding='utf-8')
          for path in ('app/keyboards.py','webapp/server.py','app/handlers/owner.py'):
              q=Path(path); text=q.read_text(encoding='utf-8').replace('20260812e','20260812f'); q.write_text(text,encoding='utf-8')

          # Persistent regressions: schema coverage + split old/new data merge.
          t=Path('tests/test_step83_regressions.py')
          text=t.read_text(encoding='utf-8')
          text=text.replace('from app.services import excel_bridge','from app import db as app_db\nfrom app.services import excel_bridge',1)
          marker='\n\nif __name__ == "__main__":\n'
          tests=r'''
    def test_all_chat_id_tables_are_scope_classified(self):
        with tempfile.TemporaryDirectory() as tmp:
            test_settings = replace(app_db.settings, data_dir=Path(tmp), database_path=Path(tmp) / "scope.sqlite3")
            with patch.object(app_db, "settings", test_settings), patch.object(repo, "settings", test_settings):
                app_db.init_db()
                with app_db.connect() as conn:
                    all_scoped=[]
                    for row in conn.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name"):
                        name=str(row[0]); cols=conn.execute(f'PRAGMA table_info("{name}")').fetchall()
                        if any(str(c[1])=='chat_id' for c in cols): all_scoped.append(name)
                    tenant=set(repo._tenant_scope_tables_from_conn(conn))
                excluded=set(repo._SCOPE_ROUTING_OR_TRANSIENT_TABLES)
                self.assertEqual(set(all_scoped), tenant | (set(all_scoped) & excluded))
                for required in ("company_sites","storage_locations","stock_transfers","excel_import_batches","worker_shifts","quality_inspections","maintenance_plans"):
                    self.assertIn(required, tenant)

    def test_split_legacy_and_step83_scopes_merge_transactionally(self):
        with tempfile.TemporaryDirectory() as tmp:
            test_settings = replace(app_db.settings, data_dir=Path(tmp), database_path=Path(tmp) / "split.sqlite3")
            with patch.object(app_db, "settings", test_settings), patch.object(repo, "settings", test_settings):
                app_db.init_db()
                group=-100777001; owner=777001
                app_db.execute("INSERT OR REPLACE INTO chats(chat_id,title,chat_type,is_connected) VALUES(?,?,?,1)",(group,"Завод","supergroup"))
                ok,msg,aid=repo.create_account(owner,group,"Завод")
                self.assertTrue(ok,msg)
                account=repo.get_account_by_id(aid); canonical=account.scope_chat_id
                # New Step83 structure was written into the private synthetic scope.
                app_db.execute("INSERT INTO company_sites(chat_id,settlement,name,normalized,address,created_by) VALUES(?,?,?,?,?,?)",(canonical,"Киржач","Цех 1","киржач цех 1","",owner))
                app_db.execute("INSERT INTO storage_locations(chat_id,name,normalized,code,created_by) VALUES(?,?,?,?,?)",(canonical,"Стеллаж A","стеллаж a","A",owner))
                # Legacy bot data still lives under the Telegram group id.
                cur=app_db.execute("INSERT INTO entities(chat_id,entity_type,name,normalized,default_unit) VALUES(?,?,?,?,?)",(group,"stock_item","Деталь","деталь","шт"))
                entity_id=int(cur.lastrowid)
                app_db.execute("INSERT INTO inventory(chat_id,area_id,entity_type,entity_id,unit,quantity) VALUES(?,?,?,?,?,?)",(group,None,"stock_item",entity_id,"шт",42))
                # Simulate the old faulty repair which switched the account to the group scope.
                app_db.execute("UPDATE accounting_accounts SET scope_chat_id=? WHERE id=?",(group,aid))
                repaired=repo.list_accounts_for_user(owner)[0]
                self.assertEqual(repaired.scope_chat_id, canonical)
                self.assertEqual(app_db.fetchone("SELECT quantity FROM inventory WHERE chat_id=? AND entity_id=?",(canonical,entity_id))["quantity"],42)
                self.assertIsNone(app_db.fetchone("SELECT 1 FROM inventory WHERE chat_id=?",(group,)))
                self.assertEqual(app_db.fetchone("SELECT name FROM company_sites WHERE chat_id=?",(canonical,))["name"],"Цех 1")
                self.assertEqual(app_db.fetchone("SELECT name FROM storage_locations WHERE chat_id=?",(canonical,))["name"],"Стеллаж A")
                with app_db.connect() as conn:
                    self.assertEqual(conn.execute("PRAGMA foreign_key_check").fetchall(),[])
'''
          if 'test_split_legacy_and_step83_scopes_merge_transactionally' not in text:
              text=text.replace(marker,'\n'+tests+marker,1)
          t.write_text(text,encoding='utf-8')
          PY
      - name: Verify all scope paths and full QA
        shell: bash
        run: |
          set -euo pipefail
          node --check webapp/static/app-20260812f.js
          python -m compileall -q app webapp scripts main.py
          python -m unittest discover -s tests -p 'test*.py' -v
          python scripts/security_audit.py
          python scripts/final_audit.py
          python scripts/flow_test.py
          python scripts/smoke_test.py
          python scripts/chat_visibility_test.py
          python scripts/group_conversation_filter_step57_test.py
          grep -q 'MINI_UI_VERSION = "20260812f"' app/keyboards.py
          grep -q 'MINI_UI_VERSION = "20260812f"' webapp/server.py
          grep -q 'app-20260812f.js?v=83-canonicalscope' webapp/static/index.html
          ! grep -q '_GROUP_SCOPE_DATA_TABLES' app/services/repository.py
      - name: Commit verified canonical scope fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-all-scope-split-step83.yml .github/workflows/audit-all-scope-tables-step83.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unify all tenant data in canonical account scope'
          git push origin HEAD:main
