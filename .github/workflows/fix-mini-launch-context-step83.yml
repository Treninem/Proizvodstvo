name: Fix Mini App launch context Step83

on:
  push:
    paths:
      - '.github/workflows/fix-mini-launch-context-step83.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: '123456789:TEST_TOKEN_FOR_CI_ONLY'
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-step83-launchctx'
      PUBLIC_BASE_URL: 'https://example.invalid'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Patch Mini App entrypoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('webapp/server.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('MINI_UI_VERSION = "20260812a"','MINI_UI_VERSION = "20260812d"',1)
          old='''@app.get("/mini")
          def mini(request: Request):
              if request.query_params.get("v") != MINI_UI_VERSION:
                  return RedirectResponse(url=f"/mini?v={MINI_UI_VERSION}", status_code=307)
              response = FileResponse(STATIC / "index.html")
              response.headers["Cache-Control"] = "no-store, no-cache, must-revalidate, max-age=0"
              response.headers["Pragma"] = "no-cache"
              response.headers["Expires"] = "0"
              return response
          '''
          import textwrap
          old=textwrap.dedent(old)
          new='''@app.get("/mini")
          def mini(request: Request):
              # Never redirect the Telegram Mini App launch URL. Telegram Web keeps its
              # signed tgWebAppData in the URL fragment; an HTTP redirect cannot preserve
              # that fragment because it is never sent to the server. The versioned JS
              # filename in index.html is the cache-buster, so serving HTML directly is safe.
              response = FileResponse(STATIC / "index.html")
              response.headers["Cache-Control"] = "no-store, no-cache, must-revalidate, max-age=0"
              response.headers["Pragma"] = "no-cache"
              response.headers["Expires"] = "0"
              response.headers["X-Mini-App-Version"] = MINI_UI_VERSION
              return response
          '''
          new=textwrap.dedent(new)
          if old not in s:
              raise SystemExit('old /mini redirect block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify launch context preservation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from starlette.requests import Request
          from starlette.responses import RedirectResponse
          from webapp import server
          scope={
              'type':'http','http_version':'1.1','method':'GET','scheme':'https',
              'path':'/mini','raw_path':b'/mini','query_string':b'v=old&chat_id=-1001234567890',
              'headers':[],'client':('127.0.0.1',12345),'server':('example.invalid',443),'root_path':''
          }
          response=server.mini(Request(scope))
          assert not isinstance(response, RedirectResponse), 'Mini App launch must never redirect'
          assert response.headers.get('x-mini-app-version') == '20260812d'
          assert server.MINI_UI_VERSION == '20260812d'
          print('mini launch context test: OK')
          PY
          node --check webapp/static/app-20260812d.js
          python -m compileall -q app webapp scripts main.py
          python -m unittest discover -s tests -p 'test*.py' -v
          python scripts/security_audit.py
          python scripts/final_audit.py
      - name: Commit verified server fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-mini-launch-context-step83.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Telegram Mini App launch context preservation'
          git push origin HEAD:main
