name: Mini App UX Step90

on:
  push:
    branches: [main]
    paths:
      - 'app/main.py'
      - 'app/user_directory_middleware.py'
      - 'app/services/telegram_users.py'
      - 'app/services/frontend_runtime.py'
      - 'webapp/extensions.py'
      - 'webapp/static/management-panel.js'
      - 'webapp/static/menu-navigation.js'
      - 'webapp/static/miniapp-ux.css'
      - 'tests/test_step90_miniapp_navigation.py'
      - '.github/workflows/miniapp-ux-step90.yml'
      - 'STEP90_VALIDATION_TRIGGER.txt'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-step90'
      PUBLIC_BASE_URL: 'https://procontrol.bothost.tech'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
      TRUSTED_HOSTS: ''
      CORS_ALLOWED_ORIGINS: ''
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set synthetic bot token
        shell: bash
        run: echo 'BOT_TOKEN=123456789:'"$(printf 'A%.0s' {1..30})" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-audit.txt
          python -m pip check
      - name: Compile Python
        run: python -m compileall -q app webapp tests
      - name: Check Python correctness
        run: ruff check app webapp tests --select F --output-format concise
      - name: Check Mini App JavaScript
        shell: bash
        run: |
          node --check webapp/static/app-20260816a.js
          node --check webapp/static/app-extensions.js
          node --check webapp/static/help-guide.js
          node --check webapp/static/management-panel.js
          node --check webapp/static/menu-navigation.js
      - name: Run all unit regressions
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Audit Mini App wiring and architecture
        shell: bash
        run: |
          python scripts/ui_wiring_audit_step84.py
          python scripts/full_system_audit_step83.py
      - name: Security and final smoke
        shell: bash
        run: |
          python scripts/security_audit.py
          python scripts/ui_text_audit.py
          python scripts/final_audit.py
          python scripts/flow_test.py
          python scripts/smoke_test.py
      - name: Check live deployment if available
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          base='https://procontrol.bothost.tech'
          last=''
          for attempt in range(18):
              try:
                  with urllib.request.urlopen(base+'/api/extensions/health', timeout=15) as response:
                      health=json.loads(response.read().decode('utf-8'))
                  req=urllib.request.Request(base+'/mini',headers={'Cache-Control':'no-cache','User-Agent':'Step90-live-check'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      html=response.read().decode('utf-8')
                  if health.get('catalog') and health.get('username_assignment') and '/static/menu-navigation.js?v=20260820a' in html and '/static/management-panel.js?v=20260820a' in html:
                      print('LIVE_STEP90_OK')
                      raise SystemExit(0)
                  last=f'health={health}, menu={"/static/menu-navigation.js?v=20260820a" in html}'
              except Exception as exc:
                  last=str(exc)
              if attempt < 17:
                  time.sleep(10)
          raise SystemExit('LIVE_STEP90_NOT_DEPLOYED: '+last)
          PY
