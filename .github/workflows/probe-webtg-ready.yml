name: Probe Telegram Web Mini App Ready

on:
  push:
    paths:
      - '.github/workflows/probe-webtg-ready.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe live Bothost
        id: probe
        shell: bash
        run: |
          set +e
          health=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' https://procontrol.bothost.tech/health || echo 000)
          ready=$(curl -sS --max-time 20 -o /tmp/ready.json -w '%{http_code}' https://procontrol.bothost.tech/ready || echo 000)
          mini=$(curl -sS -L --max-time 20 -o /tmp/mini.html -w '%{http_code}' 'https://procontrol.bothost.tech/mini?v=20260812b&manual=ready' || echo 000)
          asset=$(curl -sS --max-time 20 -o /tmp/app.js -w '%{http_code}' 'https://procontrol.bothost.tech/static/app-20260812b.js?manual=ready' || echo 000)
          marker=0
          grep -q 'app-20260812b.js?v=83-webtg' /tmp/mini.html 2>/dev/null && grep -q 'tgWebAppData' /tmp/app.js 2>/dev/null && marker=1
          echo "health=$health ready=$ready mini=$mini asset=$asset marker=$marker"
          echo '--- health ---'; cat /tmp/health.json 2>/dev/null; echo
          echo '--- ready ---'; cat /tmp/ready.json 2>/dev/null; echo
          echo '--- refs ---'; grep -Eo '(src|href)="[^"]+\.(js|css)(\?[^\"]*)?' /tmp/mini.html | head -20 || true
          if [ "$health" = 200 ] && [ "$ready" = 200 ] && [ "$mini" = 200 ] && [ "$asset" = 200 ] && [ "$marker" = 1 ]; then echo 'ok=1' >> "$GITHUB_OUTPUT"; else echo 'ok=0' >> "$GITHUB_OUTPUT"; fi
      - name: Cleanup probe
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/probe-webtg-ready.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'CI: cleanup ready probe' && git push origin HEAD:main; fi
      - name: Require new deployment
        if: steps.probe.outputs.ok != '1'
        run: exit 1
