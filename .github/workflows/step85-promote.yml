name: Step85 cache-safe Mini App promotion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote repaired frontend
        run: python scripts/promote_step85_frontend.py
      - name: Verify promoted source contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app webapp scripts tests main.py
          python scripts/docker_contract_audit_step84.py
          node --check webapp/static/app-20260816a.js
          python -m unittest tests.test_step84_live_deployment_gate tests.test_frontend_runtime_repair -v
      - name: Commit promoted runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile app/handlers/owner.py app/keyboards.py webapp/server.py webapp/static/index.html webapp/static/app.js webapp/static/app-20260816a.js tests/test_step84_live_deployment_gate.py
          if git diff --cached --quiet; then
            echo "No promotion changes to commit"
            exit 0
          fi
          git commit -m "Promote Step85 cache-safe Mini App runtime"
          git push origin HEAD:main
