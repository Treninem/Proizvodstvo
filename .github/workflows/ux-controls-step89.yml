name: UX controls Step89

on:
  push:
    branches: [main]
    paths:
      - 'app/handlers/component_picker.py'
      - 'app/handlers/reply_job_assignment.py'
      - 'app/handlers/help_guide.py'
      - 'app/main.py'
      - 'app/services/frontend_runtime.py'
      - 'webapp/static/help-guide.js'
      - 'tests/test_step87_help_guide.py'
      - 'tests/test_step88_component_picker.py'
      - 'tests/test_step89_reply_job_assignment.py'
      - '.github/workflows/ux-controls-step89.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-step89'
      PUBLIC_BASE_URL: 'https://procontrol.bothost.tech'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
      TRUSTED_HOSTS: ''
      CORS_ALLOWED_ORIGINS: ''
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set synthetic bot token
        shell: bash
        run: echo 'BOT_TOKEN=123456789:'"$(printf 'A%.0s' {1..30})" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-audit.txt
      - name: Compile changed flows
        run: python -m compileall -q app/handlers/component_picker.py app/handlers/reply_job_assignment.py app/handlers/help_guide.py app/main.py app/services/frontend_runtime.py tests/test_step87_help_guide.py tests/test_step88_component_picker.py tests/test_step89_reply_job_assignment.py
      - name: Check Python correctness
        run: ruff check app/handlers/component_picker.py app/handlers/reply_job_assignment.py app/handlers/help_guide.py app/main.py app/services/frontend_runtime.py tests/test_step87_help_guide.py tests/test_step88_component_picker.py tests/test_step89_reply_job_assignment.py --select F --output-format concise
      - name: Check Mini App guide JavaScript
        run: node --check webapp/static/help-guide.js
      - name: Run UX regressions
        run: python -m unittest tests.test_frontend_runtime_repair tests.test_step87_help_guide tests.test_step88_component_picker tests.test_step89_reply_job_assignment -v
