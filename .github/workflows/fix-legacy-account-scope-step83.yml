name: Fix legacy account scope Step83

on:
  push:
    paths:
      - '.github/workflows/fix-legacy-account-scope-step83.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: '123456789:TEST_TOKEN_FOR_CI_ONLY'
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-step83-legacyscope'
      PUBLIC_BASE_URL: 'https://example.invalid'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Apply safe legacy scope migration and bump Mini App
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('app/services/repository.py')
          s=p.read_text(encoding='utf-8')
          old='''    return accounts\n\n\n\ndef _unique_account_name'''
          new='''    # Safe compatibility migration for accounts created after older releases\n    # had already stored business data directly under the Telegram group chat_id.\n    # The existing repair helper only switches the scope when the synthetic scope\n    # is completely empty and the original group scope contains real business rows;\n    # if both sides contain data or another account owns the scope, it does nothing.\n    repaired_accounts: list[AccountingAccount] = []\n    for account in accounts:\n        chat_row = db.fetchone("SELECT chat_type FROM chats WHERE chat_id=?", (int(account.owner_chat_id),))\n        chat_type = str(chat_row["chat_type"] or "") if chat_row else ""\n        if chat_type in {"group", "supergroup"}:\n            account = _repair_empty_account_scope_from_group(account, int(account.owner_chat_id))\n        repaired_accounts.append(account)\n    return repaired_accounts\n\n\n\ndef _unique_account_name'''
          if old not in s:
              raise SystemExit('list_accounts_for_user return block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('tests/test_step83_regressions.py')
          s=p.read_text(encoding='utf-8')
          marker='''    def test_encrypted_backups_are_visible_in_backup_list(self):\n'''
          test='''    def test_account_listing_repairs_empty_synthetic_scope_from_legacy_group(self):\n        row = {\n            "id": 7, "owner_user_id": 55, "owner_chat_id": -100777,\n            "scope_chat_id": -900000000007, "name": "Цех",\n            "normalized": "цех", "is_general": 0,\n        }\n        repaired = repo.AccountingAccount(\n            id=7, owner_user_id=55, owner_chat_id=-100777,\n            scope_chat_id=-100777, name="Цех", normalized="цех", is_general=False,\n        )\n        with patch.object(repo.db, "fetchall", side_effect=[[row], []]), \\\n             patch.object(repo.db, "fetchone", return_value={"chat_type": "supergroup"}), \\\n             patch.object(repo, "_repair_empty_account_scope_from_group", return_value=repaired) as repair:\n            accounts = repo.list_accounts_for_user(55)\n        self.assertEqual(len(accounts), 1)\n        self.assertEqual(accounts[0].scope_chat_id, -100777)\n        repair.assert_called_once()\n        self.assertEqual(repair.call_args.args[1], -100777)\n\n'''
          if marker not in s:
              raise SystemExit('test insertion marker not found')
          p.write_text(s.replace(marker,test+marker,1),encoding='utf-8')

          # New immutable asset name so Telegram Web cannot keep an old cached bootstrap.
          src=Path('webapp/static/app-20260812d.js')
          dst=Path('webapp/static/app-20260812e.js')
          js=src.read_text(encoding='utf-8').replace('const MINI_APP_VERSION="20260812d";','const MINI_APP_VERSION="20260812e";',1)
          dst.write_text(js,encoding='utf-8')

          p=Path('webapp/static/index.html')
          x=p.read_text(encoding='utf-8')
          if '/static/app-20260812d.js?v=83-userctx' not in x:
              raise SystemExit('20260812d index ref not found')
          p.write_text(x.replace('/static/app-20260812d.js?v=83-userctx','/static/app-20260812e.js?v=83-legacyscope',1),encoding='utf-8')

          p=Path('app/keyboards.py')
          x=p.read_text(encoding='utf-8')
          if 'MINI_UI_VERSION = "20260812d"' not in x:
              raise SystemExit('keyboard version 20260812d not found')
          p.write_text(x.replace('MINI_UI_VERSION = "20260812d"','MINI_UI_VERSION = "20260812e"',1),encoding='utf-8')

          p=Path('app/handlers/owner.py')
          x=p.read_text(encoding='utf-8').replace('Mini App 20260812d','Mini App 20260812e').replace('Mini App: 20260812d','Mini App: 20260812e')
          p.write_text(x,encoding='utf-8')
          PY
      - name: Verify migration and regressions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'repaired_accounts' app/services/repository.py
          grep -q '_repair_empty_account_scope_from_group(account, int(account.owner_chat_id))' app/services/repository.py
          grep -q 'test_account_listing_repairs_empty_synthetic_scope_from_legacy_group' tests/test_step83_regressions.py
          grep -q 'app-20260812e.js?v=83-legacyscope' webapp/static/index.html
          grep -q 'MINI_UI_VERSION = "20260812e"' app/keyboards.py
          node --check webapp/static/app-20260812e.js
          python -m compileall -q app webapp scripts main.py
          python -m unittest discover -s tests -p 'test*.py' -v
          python scripts/security_audit.py
          python scripts/final_audit.py
      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-legacy-account-scope-step83.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair legacy group account scope in Mini App'
          git push origin HEAD:main
