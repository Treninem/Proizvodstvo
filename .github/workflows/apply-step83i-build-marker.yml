name: Apply Step83i backend build marker

on:
  push:
    paths:
      - '.github/workflows/apply-step83i-build-marker.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-step83i-marker'
      PUBLIC_BASE_URL: 'https://example.invalid'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
      TRUSTED_HOSTS: ''
      CORS_ALLOWED_ORIGINS: ''
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - name: Set synthetic CI bot token
        shell: bash
        run: echo 'BOT_TOKEN=123456789:'"$(printf 'A%.0s' {1..30})" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Add build marker to liveness/readiness
        shell: python
        run: |
          from pathlib import Path
          p=Path('webapp/server.py')
          text=p.read_text(encoding='utf-8')
          health='''        "status": "ok",\n        "bot_enabled": settings.bot_enabled,'''
          health_new='''        "status": "ok",\n        "build": "83i",\n        "bot_enabled": settings.bot_enabled,'''
          ready='''        "status": "ready" if probe.get("ok") else "degraded",\n        "database": bool(probe.get("ok")),'''
          ready_new='''        "status": "ready" if probe.get("ok") else "degraded",\n        "build": "83i",\n        "database": bool(probe.get("ok")),'''
          if text.count(health) != 1 or text.count(ready) != 1:
              raise SystemExit('health/ready marker insertion point not unique')
          text=text.replace(health,health_new,1).replace(ready,ready_new,1)
          p.write_text(text,encoding='utf-8')
      - name: Compile and core E2E
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app webapp scripts tests main.py
          python scripts/sql_schema_compile_audit.py
          python scripts/full_system_audit_step83.py
          python -m unittest discover -s tests -p 'test*.py' -v
      - name: Existing QA and security
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/*_test.py; do python "$f"; done
          python scripts/security_audit.py
          python scripts/ui_text_audit.py
          python scripts/final_audit.py
          python scripts/flow_test.py
          python scripts/smoke_test.py
          python scripts/runtime_guard_test.py
      - name: Commit verified backend marker
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-step83i-build-marker.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Step83i: expose verified backend build marker'
          git push origin HEAD:main
