name: Apply Step83j deduplicate Python v2

on:
  push:
    paths:
      - '.github/workflows/apply-step83j-deduplicate-python-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-step83j-v2'
      PUBLIC_BASE_URL: 'https://example.invalid'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
      TRUSTED_HOSTS: ''
      CORS_ALLOWED_ORIGINS: ''
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - name: Set synthetic CI bot token
        shell: bash
        run: echo 'BOT_TOKEN=123456789:'"$(printf 'A%.0s' {1..30})" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Preserve legacy report implementation under an explicit name
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/services/reporting.py')
          text=p.read_text(encoding='utf-8')
          marker='_legacy_report_sections_step63 = report_sections\n'
          if text.count(marker)!=1:
              raise SystemExit('legacy report alias marker not unique')
          before,after=text.split(marker,1)
          needle='def report_sections('
          pos=before.rfind(needle)
          if pos<0:
              raise SystemExit('legacy report_sections definition not found before alias')
          before=before[:pos]+'def _legacy_report_sections_step63('+before[pos+len(needle):]
          p.write_text(before+after,encoding='utf-8')
      - name: Remove earlier shadowed definitions except renamed legacy report
        shell: python
        run: |
          import ast
          from pathlib import Path
          targets=[Path('app/services/dashboard.py'),Path('app/services/reporting.py'),Path('app/services/repository.py')]
          removed=[]
          for path in targets:
              text=path.read_text(encoding='utf-8')
              lines=text.splitlines(keepends=True)
              tree=ast.parse(text,filename=str(path))
              groups={}
              for node in tree.body:
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef)):
                      groups.setdefault(node.name,[]).append(node)
              ranges=[]
              for name,nodes in groups.items():
                  for node in nodes[:-1]:
                      starts=[node.lineno]+[getattr(d,'lineno',node.lineno) for d in getattr(node,'decorator_list',[])]
                      ranges.append((min(starts)-1,int(node.end_lineno),name,node.lineno,nodes[-1].lineno))
              for start,end,name,old_line,kept_line in sorted(ranges,reverse=True):
                  del lines[start:end]
                  removed.append(f'{path}:{name}:{old_line}->{kept_line}')
              path.write_text(''.join(lines),encoding='utf-8')
          print('REMOVED',len(removed))
          for x in removed: print(x)
          # Original audit found 15 duplicates; report_sections was renamed instead of removed.
          if len(removed)!=14:
              raise SystemExit(f'expected 14 removals after legacy rename, got {len(removed)}')
      - name: Verify legacy report exists and no shadowed definitions remain
        shell: python
        run: |
          import ast,re
          from pathlib import Path
          problems=[]
          reporting=Path('app/services/reporting.py').read_text(encoding='utf-8')
          if reporting.count('def _legacy_report_sections_step63(')!=1:
              problems.append('legacy report implementation missing')
          if '_legacy_report_sections_step63 = report_sections' in reporting:
              problems.append('old legacy alias assignment remains')
          for base in ('app','webapp'):
              for path in sorted(Path(base).rglob('*.py')):
                  tree=ast.parse(path.read_text(encoding='utf-8'),filename=str(path))
                  seen={}; routes={}
                  for node in tree.body:
                      if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef)):
                          if node.name in seen: problems.append(f'duplicate {path}:{node.name}:{seen[node.name]}->{node.lineno}')
                          else: seen[node.name]=node.lineno
                      if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                          for dec in node.decorator_list:
                              if isinstance(dec,ast.Call) and isinstance(dec.func,ast.Attribute) and dec.args and isinstance(dec.args[0],ast.Constant):
                                  method=dec.func.attr.upper(); route=str(dec.args[0].value); key=(method,route)
                                  if method in {'GET','POST','PUT','PATCH','DELETE'}:
                                      if key in routes: problems.append(f'duplicate route {path}:{method} {route}')
                                      routes[key]=node.lineno
          html=Path('webapp/static/index.html').read_text(encoding='utf-8')
          v=re.search(r'app-(20\d{6}[a-z])\.js',html).group(1)
          js=Path(f'webapp/static/app-{v}.js').read_text(encoding='utf-8')
          seen={}
          for m in re.finditer(r'(?m)^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',js):
              name=m.group(1); line=js.count('\n',0,m.start())+1
              if name in seen: problems.append(f'duplicate JS function {name}:{seen[name]}->{line}')
              seen[name]=line
          if problems:
              print('\n'.join(problems)); raise SystemExit(1)
          print('NO_SHADOWED_DEFINITIONS')
      - name: Compile and schema-aware SQL audit
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app webapp scripts tests main.py
          python scripts/sql_schema_compile_audit.py
      - name: Full architecture audit
        run: python scripts/full_system_audit_step83.py
      - name: All regressions and full Mini App E2E
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Existing QA, reports and security
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/*_test.py; do python "$f"; done
          python scripts/security_audit.py
          python scripts/ui_text_audit.py
          python scripts/final_audit.py
          python scripts/flow_test.py
          python scripts/smoke_test.py
          python scripts/runtime_guard_test.py
      - name: Install permanent duplicate-definition guard
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/full_system_audit_step83.py')
          text=p.read_text(encoding='utf-8')
          if 'def audit_shadowed_definitions()' not in text:
              marker='def audit_repository_hygiene() -> None:\n'
              block='''def audit_shadowed_definitions() -> None:\n    import ast\n    duplicates = []\n    route_duplicates = []\n    for base in (ROOT / "app", ROOT / "webapp"):\n        for path in sorted(base.rglob("*.py")):\n            tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))\n            seen = {}\n            routes = {}\n            for node in tree.body:\n                if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):\n                    if node.name in seen:\n                        duplicates.append(f"{path.relative_to(ROOT)}:{node.name}:{seen[node.name]}->{node.lineno}")\n                    else:\n                        seen[node.name] = node.lineno\n                if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):\n                    for dec in node.decorator_list:\n                        if isinstance(dec, ast.Call) and isinstance(dec.func, ast.Attribute) and dec.args and isinstance(dec.args[0], ast.Constant):\n                            method = dec.func.attr.upper()\n                            route = str(dec.args[0].value)\n                            if method in {"GET", "POST", "PUT", "PATCH", "DELETE"}:\n                                key = (method, route)\n                                if key in routes:\n                                    route_duplicates.append(f"{path.relative_to(ROOT)}:{method} {route}:{routes[key]}->{node.lineno}")\n                                else:\n                                    routes[key] = node.lineno\n    check(not duplicates, "Shadowed Python definitions: " + "; ".join(duplicates))\n    check(not route_duplicates, "Duplicate API routes: " + "; ".join(route_duplicates))\n    print("SHADOWED_DEFINITIONS_OK")\n\n\n'''
              if marker not in text: raise SystemExit('audit insertion marker missing')
              text=text.replace(marker,block+marker,1)
              old='''        audit_sql_join_tenant_hardening,\n        audit_repository_hygiene,\n'''
              new='''        audit_sql_join_tenant_hardening,\n        audit_shadowed_definitions,\n        audit_repository_hygiene,\n'''
              if old not in text: raise SystemExit('audit list marker missing')
              text=text.replace(old,new,1)
              p.write_text(text,encoding='utf-8')
      - name: Re-run permanent audit and regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app webapp scripts tests main.py
          python scripts/full_system_audit_step83.py
          python -m unittest discover -s tests -p 'test*.py' -v
      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-step83j-deduplicate-python.yml
          rm -f .github/workflows/apply-step83j-deduplicate-python-v2.yml
          rm -f .github/workflows/audit-duplicate-definitions-step83.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Step83j: remove shadowed definitions and preserve legacy reports'
          git push origin HEAD:main
