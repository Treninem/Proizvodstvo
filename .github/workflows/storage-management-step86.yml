name: Storage management Step86

on:
  push:
    branches: [main]
    paths:
      - 'app/handlers/management.py'
      - 'app/main.py'
      - 'app/runtime.py'
      - 'app/services/frontend_runtime.py'
      - 'webapp/extensions.py'
      - 'webapp/static/app-extensions.js'
      - 'tests/test_frontend_runtime_repair.py'
      - 'tests/test_step86_storage_management.py'
      - 'STEP86_VALIDATION_TRIGGER.txt'
      - '.github/workflows/storage-management-step86.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/handlers/management.py'
      - 'app/main.py'
      - 'app/runtime.py'
      - 'app/services/frontend_runtime.py'
      - 'webapp/extensions.py'
      - 'webapp/static/app-extensions.js'
      - 'tests/test_frontend_runtime_repair.py'
      - 'tests/test_step86_storage_management.py'
      - 'STEP86_VALIDATION_TRIGGER.txt'
      - '.github/workflows/storage-management-step86.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-step86'
      PUBLIC_BASE_URL: 'https://procontrol.bothost.tech'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
      TRUSTED_HOSTS: ''
      CORS_ALLOWED_ORIGINS: ''
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set synthetic CI bot token
        shell: bash
        run: echo 'BOT_TOKEN=123456789:'"$(printf 'A%.0s' {1..30})" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-audit.txt
      - name: Focused compile and lint
        id: local_tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app/handlers/management.py app/main.py app/runtime.py app/services/frontend_runtime.py webapp/extensions.py tests/test_step86_storage_management.py tests/test_frontend_runtime_repair.py
          ruff check app/handlers/management.py app/main.py app/runtime.py app/services/frontend_runtime.py webapp/extensions.py tests/test_step86_storage_management.py tests/test_frontend_runtime_repair.py --select F --output-format concise
          node --check webapp/static/app-extensions.js
          python -m unittest tests.test_frontend_runtime_repair tests.test_step86_storage_management -v
      - name: Verify deployed Mini App extension
        id: live_test
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          base='https://procontrol.bothost.tech'
          last=''
          for attempt in range(30):
              try:
                  req=urllib.request.Request(base+'/api/extensions/health',headers={'Cache-Control':'no-cache','User-Agent':'Step86-live-check'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      data=json.loads(response.read().decode('utf-8'))
                  req2=urllib.request.Request(base+'/mini',headers={'Cache-Control':'no-cache','User-Agent':'Step86-live-check'})
                  with urllib.request.urlopen(req2,timeout=15) as response:
                      html=response.read().decode('utf-8')
                  if data.get('ok') is True and data.get('naming') is True and '/static/app-extensions.js?v=20260820a' in html:
                      print('LIVE_STEP86_OK')
                      raise SystemExit(0)
                  last=f'health={data!r}, extension_tag={"/static/app-extensions.js?v=20260820a" in html}'
              except Exception as exc:
                  last=str(exc)
              if attempt < 29:
                  time.sleep(20)
          raise SystemExit('LIVE_STEP86_FAILED: '+last)
          PY
      - name: Publish Step86 status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_OUTCOME: ${{ steps.local_tests.outcome }}
          LIVE_OUTCOME: ${{ steps.live_test.outcome }}
        run: |
          set -euo pipefail
          state=success
          description='bot+mini storage management passed'
          if [ "$LOCAL_OUTCOME" != success ] || [ "$LIVE_OUTCOME" != success ]; then
            state=failure
            description="local=$LOCAL_OUTCOME live=$LIVE_OUTCOME"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"$state\",\"context\":\"storage-management-step86\",\"description\":\"$description\"}"
      - name: Fail workflow when verification failed
        if: steps.local_tests.outcome != 'success' || steps.live_test.outcome != 'success'
        run: exit 1
