name: Apply Step83k undefined names

on:
  push:
    paths:
      - '.github/workflows/apply-step83k-undefined-names.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-step83k'
      PUBLIC_BASE_URL: 'https://example.invalid'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
      TRUSTED_HOSTS: ''
      CORS_ALLOWED_ORIGINS: ''
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - name: Set synthetic CI bot token
        shell: bash
        run: echo 'BOT_TOKEN=123456789:'"$(printf 'A%.0s' {1..30})" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and ruff
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Fix component amount formatting and stock-risk scope
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/keyboards.py')
          text=p.read_text(encoding='utf-8')
          marker='def component_choice_keyboard(components: list[dict], mode: str) -> InlineKeyboardMarkup:\n'
          helper='''def _format_keyboard_amount(value: float) -> str:\n    number = float(value)\n    if number.is_integer():\n        return f"{int(number):,}".replace(",", " ")\n    return f"{number:,.3f}".rstrip("0").rstrip(".").replace(",", " ").replace(".", ",")\n\n\n'''
          if text.count(marker)!=1: raise SystemExit('component keyboard marker missing')
          if '_format_keyboard_amount' not in text:
              text=text.replace(marker,helper+marker,1)
          if text.count('format_amount(qty)')!=1: raise SystemExit('format_amount use not unique')
          text=text.replace('format_amount(qty)','_format_keyboard_amount(qty)',1)
          p.write_text(text,encoding='utf-8')

          p=Path('app/services/stock_risk.py')
          text=p.read_text(encoding='utf-8')
          bad='if repo.is_tenant_admin(scope, user_id):\n'
          if text.count(bad)!=1: raise SystemExit('undefined stock-risk scope use not unique')
          p.write_text(text.replace(bad,'if repo.is_tenant_admin(chat_id, user_id):\n',1),encoding='utf-8')
      - name: Add targeted regressions
        shell: python
        run: |
          from pathlib import Path
          p=Path('tests/test_step83_undefined_paths.py')
          p.write_text(r'''from __future__ import annotations

import os
import tempfile
import unittest
from dataclasses import replace
from pathlib import Path
from unittest.mock import patch

os.environ.setdefault("OWNER_TELEGRAM_ID", "2097006037")
os.environ.setdefault("PUBLIC_BASE_URL", "https://example.invalid")

from app import db
from app.config import settings
from app import keyboards
from app.services import repository as repo
from app.services import stock_risk


class HiddenUndefinedPathTests(unittest.TestCase):
    def test_component_choice_keyboard_formats_quantity_without_nameerror(self):
        markup = keyboards.component_choice_keyboard([
            {"component_id": 1, "name": "Комплектующая тест", "quantity": 1234.5, "default_unit": "шт"}
        ], "add")
        dumped = str(markup.model_dump())
        self.assertIn("Комплектующая тест", dumped)
        self.assertIn("1 234,5", dumped)

    def test_stock_risk_event_access_uses_supplied_tenant_context(self):
        with tempfile.TemporaryDirectory() as tmp:
            test_settings = replace(settings, data_dir=Path(tmp), database_path=Path(tmp)/"risk.sqlite3")
            with patch.object(db, "settings", test_settings), patch.object(repo, "settings", test_settings):
                db.init_db()
                owner=int(settings.primary_owner_id or 2097006037)
                repo.upsert_chat(owner,"Owner","private",connected=True)
                ok,msg,aid=repo.create_account(owner,owner,"Risk tenant")
                self.assertTrue(ok,msg)
                account=repo.get_account_by_id(aid)
                self.assertTrue(repo.is_tenant_admin(account.scope_chat_id,owner))
                event={"created_by": owner, "department_id": None, "entity_id": None}
                self.assertTrue(stock_risk._event_accessible_to_user(event, account.scope_chat_id, owner))


if __name__ == "__main__":
    unittest.main()
''',encoding='utf-8')
      - name: Ruff correctness gate
        shell: bash
        run: |
          set +e
          ruff check app webapp --select F --output-format concise | tee /tmp/ruff.txt
          if grep -E 'F821|F822|F823|F811' /tmp/ruff.txt; then exit 1; fi
          exit 0
      - name: Compile SQL audit architecture and all regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app webapp scripts tests main.py
          python scripts/sql_schema_compile_audit.py
          python scripts/full_system_audit_step83.py
          python -m unittest discover -s tests -p 'test*.py' -v
      - name: Existing QA and security
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/*_test.py; do python "$f"; done
          python scripts/security_audit.py
          python scripts/ui_text_audit.py
          python scripts/final_audit.py
          python scripts/flow_test.py
          python scripts/smoke_test.py
          python scripts/runtime_guard_test.py
      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-step83k-undefined-names.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Step83k: fix hidden keyboard and stock-risk runtime errors'
          git push origin HEAD:main
