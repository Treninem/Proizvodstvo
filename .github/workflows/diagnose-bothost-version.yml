name: Diagnose Bothost Version

on:
  push:
    paths:
      - '.github/workflows/diagnose-bothost-version.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live Mini App assets
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L --max-time 20 -D /tmp/headers.txt https://procontrol.bothost.tech/mini -o /tmp/mini.html
          echo '--- HTTP headers ---'
          cat /tmp/headers.txt
          echo '--- JS/CSS references ---'
          grep -Eo '(src|href)="[^"]+\.(js|css)(\?[^\"]*)?' /tmp/mini.html | head -50 || true
          echo '--- version-like markers ---'
          grep -Eo '20260[0-9]{3}[a-z]?' /tmp/mini.html | sort -u || true
          echo '--- mini first bytes ---'
          head -c 1200 /tmp/mini.html; echo
      - name: Cleanup probe
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/diagnose-bothost-version.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'CI: remove Bothost version diagnostic'
            git push origin HEAD:main
          fi
