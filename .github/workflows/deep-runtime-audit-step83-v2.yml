name: Deep runtime audit Step83 v2

on:
  push:
    paths:
      - '.github/workflows/deep-runtime-audit-step83-v2.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-deep-audit-v2'
      PUBLIC_BASE_URL: 'https://example.invalid'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
      TRUSTED_HOSTS: ''
      CORS_ALLOWED_ORIGINS: ''
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - name: Set synthetic CI bot token
        shell: bash
        run: echo 'BOT_TOKEN=123456789:'"$(printf 'A%.0s' {1..30})" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and ruff
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Ruff correctness scan
        shell: bash
        run: |
          set +e
          ruff check app webapp --select F --output-format concise | tee /tmp/ruff.txt
          if grep -E 'F821|F822|F823|F811' /tmp/ruff.txt; then exit 1; fi
          echo RUFF_CORRECTNESS_OK
      - name: Runtime GET API smoke on seeded tenant
        shell: python
        run: |
          import re
          from urllib.parse import quote
          from fastapi.testclient import TestClient
          from app import db
          from app.config import settings
          from app.services import repository as repo
          from webapp import server

          db.init_db()
          owner=int(settings.primary_owner_id or 2097006037)
          repo.upsert_chat(owner,'Deep audit owner','private',connected=True)
          ok,msg,aid=repo.create_account(owner,owner,'DEEP API AUDIT')
          if not ok:
              accounts=repo.list_accounts_for_user(owner)
              if not accounts: raise SystemExit(msg)
              account=accounts[0]
          else:
              account=repo.get_account_by_id(aid)
          scope=int(account.scope_chat_id)
          repo.create_area(scope,'API Area')
          for typ,name,unit in (
              ('component','API Component','шт'),('material','API Material','кг'),
              ('stock_item','API Stock','шт'),('product','API Product','шт'),('meter','API Meter','кВт·ч')):
              repo.create_entity(scope,typ,name,unit)
          area_row=db.fetchone("SELECT id FROM areas WHERE chat_id=? AND is_archived=0 ORDER BY id LIMIT 1",(scope,))
          entity_row=db.fetchone("SELECT id FROM entities WHERE chat_id=? AND is_archived=0 ORDER BY id LIMIT 1",(scope,))
          ids={'chat_id':scope,'scope_chat_id':scope,'user_id':owner,'account_id':int(account.id),
               'area_id':int(area_row['id']) if area_row else 1,'entity_id':int(entity_row['id']) if entity_row else 1}
          client=TestClient(server.app,raise_server_exceptions=False)
          spec=server.app.openapi(); headers={'X-Access-Token':settings.miniapp_api_token}
          results=[]; failures=[]
          def sample(name,schema):
              if name in ids:return ids[name]
              low=name.lower()
              if low.endswith('_id') or low=='id':return 1
              if 'date' in low:return '2026-08-12'
              if low=='from':return '2026-08-01'
              if low=='to':return '2026-08-12'
              if 'status' in low:return 'open'
              if 'type' in low:return 'component'
              if 'limit' in low:return 10
              typ=(schema or {}).get('type')
              if typ=='integer':return 1
              if typ=='number':return 1
              if typ=='boolean':return False
              if typ=='array':return []
              return 'audit'
          for path,item in sorted(spec.get('paths',{}).items()):
              op=item.get('get')
              if not op or not path.startswith('/api/'):continue
              params={}; rendered=path
              for p in op.get('parameters',[]):
                  name=p.get('name'); where=p.get('in'); value=sample(name,p.get('schema') or {})
                  if where=='path':rendered=rendered.replace('{'+name+'}',quote(str(value),safe=''))
                  elif where=='query' and (p.get('required') or name in ids or name=='limit'):params[name]=value
              declared={p.get('name') for p in op.get('parameters',[]) if p.get('in')=='query'}
              for key in ('chat_id','user_id'):
                  if key in declared and key not in params:params[key]=ids[key]
              try:
                  response=client.get(rendered,params=params,headers=headers,follow_redirects=False)
                  status=response.status_code; results.append((path,status))
                  if status>=500:failures.append((path,status,response.text[:800]))
              except Exception as exc:failures.append((path,'EXC',repr(exc)))
          print(f'GET_API_ROUTES_TESTED={len(results)}')
          for path,status in results:print(f'GET_API {status} {path}')
          if failures:
              print('GET_API_FAILURES',len(failures))
              for x in failures:print('GET_API_FAIL',x)
              raise SystemExit(1)
          print('GET_API_RUNTIME_OK')
      - name: Dynamic select population audit
        shell: python
        run: |
          import re
          from pathlib import Path
          html=Path('webapp/static/index.html').read_text(encoding='utf-8')
          m=re.search(r'app-(20\d{6}[a-z])\.js',html)
          if not m:raise SystemExit('active JS not found')
          js=Path(f'webapp/static/app-{m.group(1)}.js').read_text(encoding='utf-8')
          selects=[]; dynamic=[]; missing=[]
          for sm in re.finditer(r'<select\b([^>]*)>(.*?)</select>',html,re.I|re.S):
              attrs,body=sm.group(1),sm.group(2)
              im=re.search(r'\bid=["\']([^"\']+)',attrs,re.I)
              if not im:continue
              sid=im.group(1); selects.append(sid)
              options=len(re.findall(r'<option\b',body,re.I))
              if options<=1:
                  dynamic.append(sid)
                  direct=bool(re.search(rf"fillSelect\(\s*['\"]{re.escape(sid)}['\"]",js))
                  dom=bool(re.search(rf"byId\(\s*['\"]{re.escape(sid)}['\"]\s*\)[^\n]{{0,220}}(?:innerHTML|appendChild|options|replaceChildren)",js))
                  generic=bool(re.search(rf"['\"]{re.escape(sid)}['\"][^\n]{{0,300}}fillSelect",js) or re.search(rf"fillSelect[^\n]{{0,300}}['\"]{re.escape(sid)}['\"]",js))
                  if not (direct or dom or generic):missing.append(sid)
          print(f'SELECT_TOTAL={len(selects)} DYNAMIC={len(dynamic)}')
          print('DYNAMIC_SELECTS',','.join(dynamic))
          if missing:
              print('DYNAMIC_SELECT_WITHOUT_POPULATOR',','.join(missing))
              raise SystemExit(1)
          print('DYNAMIC_SELECT_POPULATION_OK')
