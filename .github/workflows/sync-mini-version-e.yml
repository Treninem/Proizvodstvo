name: Sync Mini App server version E

on:
  push:
    paths:
      - '.github/workflows/sync-mini-version-e.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: '123456789:TEST_TOKEN_FOR_CI_ONLY'
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-step83-versione'
      PUBLIC_BASE_URL: 'https://example.invalid'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Sync server version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('webapp/server.py')
          s=p.read_text(encoding='utf-8')
          old='MINI_UI_VERSION = "20260812d"'
          if old not in s:
              raise SystemExit('server Mini UI d version not found')
          p.write_text(s.replace(old,'MINI_UI_VERSION = "20260812e"',1),encoding='utf-8')
          PY
      - name: Verify direct Mini App launch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from starlette.requests import Request
          from starlette.responses import RedirectResponse
          from webapp import server
          scope={
              'type':'http','http_version':'1.1','method':'GET','scheme':'https',
              'path':'/mini','raw_path':b'/mini','query_string':b'v=old&chat_id=-1001234567890',
              'headers':[],'client':('127.0.0.1',12345),'server':('example.invalid',443),'root_path':''
          }
          response=server.mini(Request(scope))
          assert not isinstance(response, RedirectResponse)
          assert response.headers.get('x-mini-app-version') == '20260812e'
          assert server.MINI_UI_VERSION == '20260812e'
          print('direct Telegram Mini App launch: OK')
          PY
          node --check webapp/static/app-20260812e.js
          python -m compileall -q app webapp scripts main.py
          python -m unittest discover -s tests -p 'test*.py' -v
      - name: Commit verified sync
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-mini-version-e.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync Mini App server version 20260812e'
          git push origin HEAD:main
