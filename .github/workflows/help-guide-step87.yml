name: Help guide Step87

on:
  push:
    branches: [main]
    paths:
      - 'app/handlers/help_guide.py'
      - 'app/main.py'
      - 'app/services/frontend_runtime.py'
      - 'webapp/static/help-guide.js'
      - 'tests/test_step87_help_guide.py'
      - '.github/workflows/help-guide-step87.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-step87'
      PUBLIC_BASE_URL: 'https://procontrol.bothost.tech'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
      TRUSTED_HOSTS: ''
      CORS_ALLOWED_ORIGINS: ''
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set synthetic bot token
        shell: bash
        run: echo 'BOT_TOKEN=123456789:'"$(printf 'A%.0s' {1..30})" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-audit.txt
      - name: Compile help changes
        run: python -m compileall -q app/handlers/help_guide.py app/main.py app/services/frontend_runtime.py tests/test_step87_help_guide.py
      - name: Check Python correctness
        run: ruff check app/handlers/help_guide.py app/main.py app/services/frontend_runtime.py tests/test_step87_help_guide.py --select F --output-format concise
      - name: Check Mini App guide JavaScript
        run: node --check webapp/static/help-guide.js
      - name: Run help regressions
        run: python -m unittest tests.test_frontend_runtime_repair tests.test_step87_help_guide -v
      - name: Verify deployed help guide
        shell: bash
        run: |
          python - <<'PY'
          import time
          import urllib.request

          base='https://procontrol.bothost.tech'
          expected_tag='/static/help-guide.js?v=20260820c'
          last=''
          for attempt in range(20):
              try:
                  req=urllib.request.Request(base+'/mini',headers={'Cache-Control':'no-cache','User-Agent':'Step87-help-check'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      html=response.read().decode('utf-8')
                  req=urllib.request.Request(base+'/static/help-guide.js?v=20260820c',headers={'Cache-Control':'no-cache','User-Agent':'Step87-help-check'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      guide=response.read().decode('utf-8')
                  if expected_tag in html and 'Как назначить должность сотруднику' in guide and 'Состав изделия' in guide:
                      print('LIVE_HELP_GUIDE_OK')
                      raise SystemExit(0)
                  last=f'tag={expected_tag in html}, assignment={"Как назначить должность сотруднику" in guide}'
              except Exception as exc:
                  last=str(exc)
              if attempt < 19:
                  time.sleep(10)
          raise SystemExit('LIVE_HELP_GUIDE_FAILED: '+last)
          PY
