name: Component picker Step88

on:
  push:
    branches: [main]
    paths:
      - 'app/handlers/component_picker.py'
      - 'app/main.py'
      - 'tests/test_step88_component_picker.py'
      - '.github/workflows/component-picker-step88.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-step88'
      PUBLIC_BASE_URL: 'https://procontrol.bothost.tech'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
      TRUSTED_HOSTS: ''
      CORS_ALLOWED_ORIGINS: ''
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set synthetic bot token
        shell: bash
        run: echo 'BOT_TOKEN=123456789:'"$(printf 'A%.0s' {1..30})" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-audit.txt
      - name: Compile picker changes
        run: python -m compileall -q app/handlers/component_picker.py app/main.py tests/test_step88_component_picker.py
      - name: Check Python correctness
        run: ruff check app/handlers/component_picker.py app/main.py tests/test_step88_component_picker.py --select F --output-format concise
      - name: Run picker regressions
        run: python -m unittest tests.test_step88_component_picker -v
