name: Apply Step83k targeted runtime fixes

on:
  push:
    paths:
      - '.github/workflows/apply-step83k-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-step83k-v3'
      PUBLIC_BASE_URL: 'https://example.invalid'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
      TRUSTED_HOSTS: ''
      CORS_ALLOWED_ORIGINS: ''
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - name: Set synthetic CI bot token
        shell: bash
        run: echo 'BOT_TOKEN=123456789:'"$(printf 'A%.0s' {1..30})" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and ruff
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/keyboards.py')
          text = p.read_text(encoding='utf-8')
          marker = 'def component_choice_keyboard(components: list[dict], mode: str) -> InlineKeyboardMarkup:\n'
          helper = 'def _format_keyboard_amount(value: float) -> str:\n    number = float(value)\n    if number.is_integer():\n        return f"{int(number):,}".replace(",", " ")\n    return f"{number:,.3f}".rstrip("0").rstrip(".").replace(",", " ").replace(".", ",")\n\n\n'
          if '_format_keyboard_amount' not in text:
              if text.count(marker) != 1: raise SystemExit('component marker missing')
              text = text.replace(marker, helper + marker, 1)
          if 'format_amount(qty)' in text:
              text = text.replace('format_amount(qty)', '_format_keyboard_amount(qty)', 1)
          if 'format_amount(qty)' in text: raise SystemExit('undefined formatter remains')
          p.write_text(text, encoding='utf-8')

          p = Path('app/services/stock_risk.py')
          text = p.read_text(encoding='utf-8')
          old = 'def _event_accessible_to_user(event: dict[str, Any], chat_id: int, user_id: int, *, manage: bool = False) -> bool:\n    if repo.is_tenant_admin(scope, user_id):\n'
          new = 'def _event_accessible_to_user(event: dict[str, Any], chat_id: int, user_id: int, *, manage: bool = False) -> bool:\n    if repo.is_tenant_admin(chat_id, user_id):\n'
          if text.count(old) != 1: raise SystemExit('target event access block missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Targeted runtime checks
        shell: bash
        run: |
          python - <<'PY'
          from app import keyboards
          m=keyboards.component_choice_keyboard([{'component_id':1,'name':'Компонент','quantity':1234.5,'default_unit':'шт'}],'add')
          t=str(m.model_dump()); assert '1 234,5' in t,t
          print('KEYBOARD_RUNTIME_OK')
          PY
          python - <<'PY'
          from app import db
          from app.config import settings
          from app.services import repository as repo, stock_risk
          db.init_db(); owner=int(settings.primary_owner_id or 2097006037)
          repo.upsert_chat(owner,'Owner','private',connected=True)
          ok,msg,aid=repo.create_account(owner,owner,'Risk audit'); assert ok,msg
          account=repo.get_account_by_id(aid)
          assert stock_risk._event_accessible_to_user({'created_by':owner,'department_id':None,'entity_id':None},account.scope_chat_id,owner)
          print('STOCK_RISK_RUNTIME_OK')
          PY
      - name: Ruff correctness gate
        shell: bash
        run: |
          set +e
          ruff check app webapp --select F --output-format concise | tee /tmp/ruff.txt
          if grep -E 'F821|F822|F823|F811' /tmp/ruff.txt; then exit 1; fi
          exit 0
      - name: Full validation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app webapp scripts tests main.py
          python scripts/sql_schema_compile_audit.py
          python scripts/full_system_audit_step83.py
          python -m unittest discover -s tests -p 'test*.py' -v
          for f in scripts/*_test.py; do python "$f"; done
          python scripts/security_audit.py
          python scripts/ui_text_audit.py
          python scripts/final_audit.py
          python scripts/flow_test.py
          python scripts/smoke_test.py
          python scripts/runtime_guard_test.py
      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-step83k-undefined-names.yml
          rm -f .github/workflows/apply-step83k-v2.yml
          rm -f .github/workflows/apply-step83k-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Step83k: fix hidden keyboard and stock-risk runtime errors'
          git push origin HEAD:main
