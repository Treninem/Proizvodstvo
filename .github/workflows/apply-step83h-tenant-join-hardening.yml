# rerun after operation_corrections schema review
name: Apply Step83h tenant join hardening

on:
  push:
    paths:
      - '.github/workflows/apply-step83h-tenant-join-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-step83h'
      PUBLIC_BASE_URL: 'https://example.invalid'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
      TRUSTED_HOSTS: ''
      CORS_ALLOWED_ORIGINS: ''
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - name: Set synthetic CI bot token
        shell: bash
        run: echo 'BOT_TOKEN=123456789:'"$(printf 'A%.0s' {1..30})" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Harden cross-tenant joins
        shell: python
        run: |
          from pathlib import Path

          def patch(path, replacements):
              p=Path(path); text=p.read_text(encoding='utf-8')
              for old,new,min_count in replacements:
                  count=text.count(old)
                  if count < min_count:
                      raise SystemExit(f'{path}: expected at least {min_count} occurrences, found {count}: {old[:100]!r}')
                  text=text.replace(old,new)
              p.write_text(text,encoding='utf-8')

          patch('app/services/accounting.py', [
              ('LEFT JOIN entities e ON e.id=o.entity_id','LEFT JOIN entities e ON e.id=o.entity_id AND e.chat_id=o.chat_id',1),
              ('LEFT JOIN areas a ON a.id=o.area_id','LEFT JOIN areas a ON a.id=o.area_id AND a.chat_id=o.chat_id',1),
          ])

          patch('app/services/quality_control.py', [
              ('JOIN entities e ON e.id=qi.entity_id','JOIN entities e ON e.id=qi.entity_id AND e.chat_id=qi.chat_id',2),
              ('LEFT JOIN departments d ON d.id=qi.department_id','LEFT JOIN departments d ON d.id=qi.department_id AND d.chat_id=qi.chat_id',2),
              ('LEFT JOIN areas a ON a.id=qi.area_id','LEFT JOIN areas a ON a.id=qi.area_id AND a.chat_id=qi.chat_id',2),
              ('LEFT JOIN production_lots l ON l.id=qi.lot_id','LEFT JOIN production_lots l ON l.id=qi.lot_id AND l.chat_id=qi.chat_id',2),
              ('LEFT JOIN equipment eq ON eq.id=qi.equipment_id','LEFT JOIN equipment eq ON eq.id=qi.equipment_id AND eq.chat_id=qi.chat_id',2),
              ('LEFT JOIN production_tasks t ON t.id=qi.task_id','LEFT JOIN production_tasks t ON t.id=qi.task_id AND t.chat_id=qi.chat_id',2),
          ])

          patch('app/services/production_needs_report.py', [
              ('JOIN entities e ON e.id=t.entity_id JOIN departments d ON d.id=t.department_id LEFT JOIN areas a ON a.id=t.area_id',
               'JOIN entities e ON e.id=t.entity_id AND e.chat_id=t.chat_id JOIN departments d ON d.id=t.department_id AND d.chat_id=t.chat_id LEFT JOIN areas a ON a.id=t.area_id AND a.chat_id=t.chat_id',1),
              ('comps=db.fetchall("SELECT pc.component_id,pc.quantity,e.name,e.default_unit FROM product_components pc JOIN entities e ON e.id=pc.component_id WHERE pc.product_id=?",(int(t["entity_id"]),))',
               'comps=db.fetchall("SELECT pc.component_id,pc.quantity,e.name,e.default_unit FROM product_components pc JOIN entities p ON p.id=pc.product_id JOIN entities e ON e.id=pc.component_id AND e.chat_id=p.chat_id WHERE pc.product_id=? AND p.chat_id=?",(int(t["entity_id"]),scope))',1),
              ('FROM stock_alert_rules r JOIN entities e ON e.id=r.entity_id WHERE r.chat_id=?',
               'FROM stock_alert_rules r JOIN entities e ON e.id=r.entity_id AND e.chat_id=r.chat_id WHERE r.chat_id=?',1),
          ])

          patch('app/services/reporting.py', [
              ('LEFT JOIN entities e ON e.id=o.entity_id','LEFT JOIN entities e ON e.id=o.entity_id AND e.chat_id=o.chat_id',1),
              ('LEFT JOIN areas a ON a.id=o.area_id','LEFT JOIN areas a ON a.id=o.area_id AND a.chat_id=o.chat_id',1),
              ('LEFT JOIN areas fa ON fa.id=o.from_area_id','LEFT JOIN areas fa ON fa.id=o.from_area_id AND fa.chat_id=o.chat_id',1),
              ('LEFT JOIN areas ta ON ta.id=o.to_area_id','LEFT JOIN areas ta ON ta.id=o.to_area_id AND ta.chat_id=o.chat_id',1),
          ])

          patch('app/services/production_flow.py', [
              ('JOIN departments rd ON rd.id=r.requester_department_id JOIN departments sd ON sd.id=r.supplier_department_id',
               'JOIN departments rd ON rd.id=r.requester_department_id AND rd.chat_id=r.chat_id JOIN departments sd ON sd.id=r.supplier_department_id AND sd.chat_id=r.chat_id',1),
              ('JOIN entities e ON e.id=r.entity_id LEFT JOIN areas fa ON fa.id=r.from_area_id LEFT JOIN areas ta ON ta.id=r.to_area_id',
               'JOIN entities e ON e.id=r.entity_id AND e.chat_id=r.chat_id LEFT JOIN areas fa ON fa.id=r.from_area_id AND fa.chat_id=r.chat_id LEFT JOIN areas ta ON ta.id=r.to_area_id AND ta.chat_id=r.chat_id',1),
          ])

          patch('app/services/repository.py', [
              ('JOIN entities e ON e.id=ec.entity_id AND e.is_archived=0','JOIN entities e ON e.id=ec.entity_id AND e.chat_id=ec.chat_id AND e.is_archived=0',2),
              ('LEFT JOIN entities e ON e.id=o.entity_id','LEFT JOIN entities e ON e.id=o.entity_id AND e.chat_id=o.chat_id',3),
              ('LEFT JOIN areas a ON a.id=o.area_id','LEFT JOIN areas a ON a.id=o.area_id AND a.chat_id=o.chat_id',3),
              ('LEFT JOIN areas af ON af.id=o.from_area_id','LEFT JOIN areas af ON af.id=o.from_area_id AND af.chat_id=o.chat_id',1),
              ('LEFT JOIN areas at ON at.id=o.to_area_id','LEFT JOIN areas at ON at.id=o.to_area_id AND at.chat_id=o.chat_id',1),
              ('LEFT JOIN areas fa ON fa.id=o.from_area_id','LEFT JOIN areas fa ON fa.id=o.from_area_id AND fa.chat_id=o.chat_id',2),
              ('LEFT JOIN areas ta ON ta.id=o.to_area_id','LEFT JOIN areas ta ON ta.id=o.to_area_id AND ta.chat_id=o.chat_id',2),
              ('JOIN entities e ON e.id=der.entity_id AND e.is_archived=0','JOIN departments d_scope ON d_scope.id=der.department_id\n        JOIN entities e ON e.id=der.entity_id AND e.chat_id=d_scope.chat_id AND e.is_archived=0',2),
              ('WHERE ec.entity_id=e.id ORDER BY ec.is_primary DESC,ec.id LIMIT 1','WHERE ec.entity_id=e.id AND ec.chat_id=e.chat_id ORDER BY ec.is_primary DESC,ec.id LIMIT 1',1),
              ('JOIN entities e ON e.id=p.entity_id AND e.is_archived=0\n        LEFT JOIN areas a ON a.id=p.area_id\n        LEFT JOIN areas fa ON fa.id=p.from_area_id\n        LEFT JOIN areas ta ON ta.id=p.to_area_id',
               'JOIN entities e ON e.id=p.entity_id AND e.chat_id=p.chat_id AND e.is_archived=0\n        LEFT JOIN areas a ON a.id=p.area_id AND a.chat_id=p.chat_id\n        LEFT JOIN areas fa ON fa.id=p.from_area_id AND fa.chat_id=p.chat_id\n        LEFT JOIN areas ta ON ta.id=p.to_area_id AND ta.chat_id=p.chat_id',1),
              ('SELECT a.name FROM meter_area_bindings b\n        JOIN areas a ON a.id=b.area_id\n        WHERE b.meter_id=? AND a.is_archived=0',
               'SELECT a.name FROM meter_area_bindings b\n        JOIN entities m_scope ON m_scope.id=b.meter_id\n        JOIN areas a ON a.id=b.area_id AND a.chat_id=m_scope.chat_id\n        WHERE b.meter_id=? AND a.is_archived=0 AND m_scope.is_archived=0',1),
              ('SELECT a.name FROM stock_item_area_bindings b\n        JOIN areas a ON a.id=b.area_id\n        WHERE b.stock_item_id=? AND a.is_archived=0',
               'SELECT a.name FROM stock_item_area_bindings b\n        JOIN entities s_scope ON s_scope.id=b.stock_item_id\n        JOIN areas a ON a.id=b.area_id AND a.chat_id=s_scope.chat_id\n        WHERE b.stock_item_id=? AND a.is_archived=0 AND s_scope.is_archived=0',1),
              ('FROM product_components pc\n        JOIN entities e ON e.id=pc.component_id\n        WHERE pc.product_id=? AND e.is_archived=0',
               'FROM product_components pc\n        JOIN entities p_scope ON p_scope.id=pc.product_id AND p_scope.entity_type=\'product\'\n        JOIN entities e ON e.id=pc.component_id AND e.chat_id=p_scope.chat_id\n        WHERE pc.product_id=? AND e.is_archived=0 AND p_scope.is_archived=0',1),
          ])

          patch('app/services/shift_continuity.py', [
              ('LEFT JOIN areas a ON a.id=p.area_id','LEFT JOIN areas a ON a.id=p.area_id AND a.chat_id=p.chat_id',1),
          ])

          patch('app/services/stock_risk.py', [
              ('JOIN entities e ON e.id=r.entity_id AND e.is_archived=0','JOIN entities e ON e.id=r.entity_id AND e.chat_id=r.chat_id AND e.is_archived=0',1),
              ('FROM stock_alert_rules r JOIN entities e ON e.id=r.entity_id','FROM stock_alert_rules r JOIN entities e ON e.id=r.entity_id AND e.chat_id=r.chat_id',1),
              ('LEFT JOIN areas a ON a.id=r.area_id','LEFT JOIN areas a ON a.id=r.area_id AND a.chat_id=r.chat_id',2),
              ('LEFT JOIN entities yo ON yo.id=r.yield_output_entity_id','LEFT JOIN entities yo ON yo.id=r.yield_output_entity_id AND yo.chat_id=r.chat_id',2),
              ('LEFT JOIN entities po ON po.id=r.planned_output_entity_id','LEFT JOIN entities po ON po.id=r.planned_output_entity_id AND po.chat_id=r.chat_id',2),
              ('FROM stock_observations o JOIN entities e ON e.id=o.entity_id LEFT JOIN areas a ON a.id=o.area_id',
               'FROM stock_observations o JOIN entities e ON e.id=o.entity_id AND e.chat_id=o.chat_id LEFT JOIN areas a ON a.id=o.area_id AND a.chat_id=o.chat_id',1),
          ])

          p=Path('scripts/full_system_audit_step83.py'); text=p.read_text(encoding='utf-8')
          safe='''            if "operation_corrections" in neighborhood:\n                # Child table has no chat_id by schema; original_operation_id points to\n                # globally unique operations.id, while the parent operation itself is scoped.\n                continue\n'''
          marker='''            if "chat_id" not in neighborhood and any(t in neighborhood for t in ("areas", "entities", "departments", "equipment", "production_lots", "company_sites", "storage_locations")):\n                warnings.append(f"{path.relative_to(ROOT)}:{lineno}: {line.strip()[:180]}")'''
          replacement=safe+marker
          if marker not in text:
              raise SystemExit('SQL audit heuristic marker not found')
          text=text.replace(marker,replacement,1)
          old='''    print(f"SQL_JOIN_REVIEW candidates={len(warnings)}")\n    for item in warnings[:80]:\n        print("SQL_JOIN_CANDIDATE", item)'''
          new='''    print(f"SQL_JOIN_REVIEW candidates={len(warnings)}")\n    for item in warnings[:80]:\n        print("SQL_JOIN_CANDIDATE", item)\n    check(not warnings, "Unreviewed tenant JOINs remain: " + "; ".join(warnings[:20]))'''
          if old not in text:
              raise SystemExit('SQL audit block not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

      - name: Compile
        run: python -m compileall -q app webapp scripts tests main.py
      - name: Adversarial cross-tenant tests
        run: python -m unittest tests.test_step83_cross_tenant_join_hardening -v
      - name: Full architecture audit must have zero join candidates
        run: python scripts/full_system_audit_step83.py
      - name: All regression tests
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Existing QA and security
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/*_test.py; do python "$f"; done
          python scripts/security_audit.py
          python scripts/ui_text_audit.py
          python scripts/final_audit.py
          python scripts/flow_test.py
          python scripts/smoke_test.py
      - name: Commit verified Step83h
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-step83h-tenant-join-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Step83h: harden all tenant data joins'
          git push origin HEAD:main
