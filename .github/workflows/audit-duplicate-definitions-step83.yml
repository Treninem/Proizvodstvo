name: Audit duplicate definitions Step83

on:
  push:
    paths:
      - '.github/workflows/audit-duplicate-definitions-step83.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan Python and Mini App for shadowed definitions
        shell: python
        run: |
          import ast, re
          from pathlib import Path
          root=Path('.')
          problems=[]
          py_dups=[]
          route_dups=[]
          for base in ('app','webapp'):
              for path in sorted((root/base).rglob('*.py')):
                  text=path.read_text(encoding='utf-8')
                  try: tree=ast.parse(text,filename=str(path))
                  except SyntaxError as e:
                      problems.append(f'SYNTAX {path}:{e.lineno} {e.msg}')
                      continue
                  seen={}
                  routes={}
                  for node in tree.body:
                      if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef)):
                          kind='class' if isinstance(node,ast.ClassDef) else 'function'
                          if node.name in seen:
                              py_dups.append((str(path),node.name,seen[node.name],node.lineno,kind))
                          else:
                              seen[node.name]=node.lineno
                      if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                          for dec in node.decorator_list:
                              if isinstance(dec,ast.Call) and isinstance(dec.func,ast.Attribute) and dec.args and isinstance(dec.args[0],ast.Constant):
                                  method=dec.func.attr.upper()
                                  route=str(dec.args[0].value)
                                  if method in {'GET','POST','PUT','PATCH','DELETE'}:
                                      key=(method,route)
                                      if key in routes:
                                          route_dups.append((str(path),method,route,routes[key],node.lineno,node.name))
                                      else: routes[key]=node.lineno
          print(f'PY_DUPLICATE_TOP_LEVEL={len(py_dups)}')
          for x in py_dups: print('PY_DUP',*x)
          print(f'ROUTE_DUPLICATES={len(route_dups)}')
          for x in route_dups: print('ROUTE_DUP',*x)

          # Active Mini App: duplicate function declarations are legal JS but can silently shadow.
          html=Path('webapp/static/index.html').read_text(encoding='utf-8')
          m=re.search(r'app-(20\d{6}[a-z])\.js',html)
          if not m: raise SystemExit('active Mini App JS not found')
          js_path=Path('webapp/static')/f'app-{m.group(1)}.js'
          js=js_path.read_text(encoding='utf-8')
          funcs={}; js_dups=[]
          for match in re.finditer(r'(?m)^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',js):
              name=match.group(1); line=js.count('\n',0,match.start())+1
              if name in funcs: js_dups.append((name,funcs[name],line))
              else: funcs[name]=line
          print(f'JS_DUPLICATE_FUNCTIONS={len(js_dups)}')
          for x in js_dups: print('JS_DUP',*x)
          if problems: raise SystemExit('\n'.join(problems))
          if py_dups or route_dups or js_dups:
              raise SystemExit('SHADOWED_DEFINITIONS_FOUND')
          print('NO_SHADOWED_DEFINITIONS')
