name: Fix Encrypted Backup List

on:
  push:
    paths:
      - '.github/workflows/fix-encrypted-backup-list.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: '123456789:TEST_TOKEN_FOR_CI_ONLY'
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-backup-list'
      PUBLIC_BASE_URL: 'https://example.invalid'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Patch encrypted backup listing and regression test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('app/services/backups.py')
          s = p.read_text(encoding='utf-8')
          old = '''def list_backup_files(limit: int = 10) -> list[Path]:\n    files = sorted(backups_dir().glob("*.zip"), key=lambda p: p.stat().st_mtime, reverse=True)\n    return files[:limit]\n'''
          new = '''def list_backup_files(limit: int = 10) -> list[Path]:\n    root = backups_dir()\n    files = [*root.glob("*.zip"), *root.glob("*.zip.enc")]\n    files.sort(key=lambda p: p.stat().st_mtime, reverse=True)\n    return files[: max(0, int(limit))]\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Unexpected list_backup_files implementation')
          p.write_text(s, encoding='utf-8')

          t = Path('tests/test_step83_regressions.py')
          s = t.read_text(encoding='utf-8')
          if 'test_encrypted_backups_are_visible_in_backup_list' not in s:
              s = s.replace('import json\nimport unittest\n', 'import json\nimport tempfile\nimport unittest\n')
              s = s.replace('from dataclasses import replace\n', 'from dataclasses import replace\nfrom pathlib import Path\n')
              s = s.replace(
                  'from app.services import replenishment, quality_control, stock_transfers, production_flow, inventory_adjustment\n',
                  'from app.services import replenishment, quality_control, stock_transfers, production_flow, inventory_adjustment, backups\n',
              )
              marker = 'class Step83RegressionTests(unittest.TestCase):\n'
              test = '''class Step83RegressionTests(unittest.TestCase):\n    def test_encrypted_backups_are_visible_in_backup_list(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            root = Path(tmp)\n            plain = root / "plain.zip"\n            encrypted = root / "encrypted.zip.enc"\n            ignored = root / "ignore.txt"\n            for path in (plain, encrypted, ignored):\n                path.write_bytes(b"x")\n            with patch.object(backups, "backups_dir", return_value=root):\n                names = {path.name for path in backups.list_backup_files(10)}\n            self.assertEqual(names, {"plain.zip", "encrypted.zip.enc"})\n\n'''
              if marker not in s:
                  raise SystemExit('Step83 test class marker missing')
              s = s.replace(marker, test, 1)
          t.write_text(s, encoding='utf-8')
          PY
      - name: Verify fix
        run: |
          set -euo pipefail
          python -m compileall -q app webapp
          python -m unittest discover -s tests -p 'test_step83_regressions.py' -v
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-encrypted-backup-list.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Step 83: list encrypted backups correctly'
          git push origin HEAD:main
