# rerun with secret-safe synthetic token
name: Apply Step83g account sync fix

on:
  push:
    paths:
      - '.github/workflows/apply-step83g-account-sync.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-step83g'
      PUBLIC_BASE_URL: 'https://example.invalid'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
      TRUSTED_HOSTS: ''
      CORS_ALLOWED_ORIGINS: ''
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - name: Set synthetic CI bot token
        shell: bash
        run: echo 'BOT_TOKEN=123456789:'"$(printf 'A%.0s' {1..30})" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply Step83g changes
        shell: python
        run: |
          from pathlib import Path
          import re

          old='20260812f'; new='20260812g'
          root=Path('.')

          src=root/f'webapp/static/app-{old}.js'
          dst=root/f'webapp/static/app-{new}.js'
          js=src.read_text(encoding='utf-8').replace(f'const MINI_APP_VERSION="{old}";', f'const MINI_APP_VERSION="{new}";', 1)
          stale="if(requestedChatId && allowed.has(String(requestedChatId))) chosen=String(requestedChatId);"
          active="else if(active && allowed.has(active)) chosen=active;"
          if stale not in js or active not in js:
              raise SystemExit('account selection statements not found')
          js=js.replace(stale,"if(active && allowed.has(active)) chosen=active;",1)
          js=js.replace(active,"else if(requestedChatId && allowed.has(String(requestedChatId))) chosen=String(requestedChatId);",1)
          dst.write_text(js,encoding='utf-8')

          kp=root/'app/keyboards.py'
          text=kp.read_text(encoding='utf-8').replace(f'MINI_UI_VERSION = "{old}"',f'MINI_UI_VERSION = "{new}"',1)
          pattern=r'def miniapp_url\(user_id: int \| None = None\) -> str:\n.*?\n\nPERMISSION_LABELS:'
          replacement='''def miniapp_url(user_id: int | None = None) -> str:\n    """Open Mini App without pinning a stale accounting scope in the URL."""\n    base = settings.public_base_url.rstrip("/")\n    if not base:\n        return ""\n    return base + f"/mini?v={MINI_UI_VERSION}"\n\n\nPERMISSION_LABELS:'''
          text2,n=re.subn(pattern,replacement,text,flags=re.S)
          if n != 1:
              raise SystemExit(f'miniapp_url replacement count={n}')
          kp.write_text(text2,encoding='utf-8')

          for name in ['webapp/static/index.html','webapp/server.py','app/handlers/owner.py']:
              p=root/name
              t=p.read_text(encoding='utf-8')
              if old not in t:
                  raise SystemExit(f'{old} not found in {name}')
              p.write_text(t.replace(old,new),encoding='utf-8')

          audit=root/'scripts/full_system_audit_step83.py'
          t=audit.read_text(encoding='utf-8')
          t=t.replace(
              'cur = db.execute("INSERT INTO areas(chat_id,name,normalized) VALUES(?,?,?)", (group_a, "Участок A", "участок a"))\n            area_id = int(cur.lastrowid)',
              'db.execute("INSERT INTO areas(chat_id,name,normalized) VALUES(?,?,?)", (group_a, "Участок A", "участок a"))\n            area_id = int(db.fetchone("SELECT id FROM areas WHERE chat_id=? AND normalized=?", (group_a, "участок a"))["id"])'
          )
          t=t.replace(
              'cur = db.execute("INSERT INTO entities(chat_id,entity_type,name,normalized,default_unit) VALUES(?,?,?,?,?)", (group_a, "stock_item", "Деталь A", "деталь a", "шт"))\n            entity_id = int(cur.lastrowid)',
              'db.execute("INSERT INTO entities(chat_id,entity_type,name,normalized,default_unit) VALUES(?,?,?,?,?)", (group_a, "stock_item", "Деталь A", "деталь a", "шт"))\n            entity_id = int(db.fetchone("SELECT id FROM entities WHERE chat_id=? AND entity_type=? AND normalized=?", (group_a, "stock_item", "деталь a"))["id"])'
          )
          old_hygiene='''def audit_repository_hygiene() -> None:\n    forbidden_names = {".env", "production_account.sqlite3"}\n    bad = []\n    for p in ROOT.rglob("*"):\n        if not p.is_file() or ".git" in p.parts:\n            continue\n        if p.name in forbidden_names or p.suffix in {".sqlite", ".sqlite3", ".db", ".pyc"} or p.name.endswith(".zip.enc"):\n            bad.append(str(p.relative_to(ROOT)))\n    check(not bad, "Runtime/secrets artifacts tracked in working tree: " + ", ".join(bad[:30]))'''
          new_hygiene='''def audit_repository_hygiene() -> None:\n    import subprocess\n    forbidden_names = {".env", "production_account.sqlite3"}\n    tracked = subprocess.check_output(["git", "ls-files"], cwd=ROOT, text=True).splitlines()\n    bad = []\n    for rel in tracked:\n        p = Path(rel)\n        if p.name in forbidden_names or p.suffix in {".sqlite", ".sqlite3", ".db", ".pyc"} or p.name.endswith(".zip.enc"):\n            bad.append(rel)\n    check(not bad, "Runtime/secrets artifacts tracked by Git: " + ", ".join(bad[:30]))'''
          if old_hygiene not in t:
              raise SystemExit('hygiene audit block not found')
          t=t.replace(old_hygiene,new_hygiene,1)
          audit.write_text(t,encoding='utf-8')

      - name: Compile and JS syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app webapp scripts tests main.py
          node --check webapp/static/app-20260812g.js
      - name: Account sync and product visibility regressions
        run: python -m unittest tests.test_step83_account_sync -v
      - name: Full architecture audit
        run: python scripts/full_system_audit_step83.py
      - name: All regression tests
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Existing QA and security
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/*_test.py; do python "$f"; done
          python scripts/security_audit.py
          python scripts/ui_text_audit.py
          python scripts/final_audit.py
          python scripts/flow_test.py
          python scripts/smoke_test.py
      - name: Commit verified Step83g
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-step83g-account-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Step83g: keep Mini App synchronized with active bot account'
          git push origin HEAD:main
