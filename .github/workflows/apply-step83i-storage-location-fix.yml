name: Apply Step83i storage location fix

on:
  push:
    paths:
      - '.github/workflows/apply-step83i-storage-location-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-step83i'
      PUBLIC_BASE_URL: 'https://example.invalid'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
      TRUSTED_HOSTS: ''
      CORS_ALLOWED_ORIGINS: ''
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - name: Set synthetic CI bot token
        shell: bash
        run: echo 'BOT_TOKEN=123456789:'"$(printf 'A%.0s' {1..30})" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fix storage location tenant validation
        shell: python
        run: |
          from pathlib import Path
          p=Path('webapp/server.py')
          text=p.read_text(encoding='utf-8')
          old='SELECT area_id,department_id FROM storage_locations WHERE id=? AND chat_id=? AND is_active=1'
          new='SELECT area_id,department_id FROM storage_locations WHERE id=? AND chat_id=? AND is_archived=0'
          count=text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one bad storage_locations is_active query, found {count}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
      - name: Assert no wrong storage_locations active flag remains
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -nE 'storage_locations[^\n]*is_active|is_active[^\n]*storage_locations' app webapp tests scripts
      - name: Compile
        run: python -m compileall -q app webapp scripts tests main.py
      - name: Full Mini App dictionaries/workflow E2E
        run: python -m unittest tests.test_step83_full_bootstrap_visibility -v
      - name: Full architecture audit
        run: python scripts/full_system_audit_step83.py
      - name: All regressions
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Existing QA and security
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/*_test.py; do python "$f"; done
          python scripts/security_audit.py
          python scripts/ui_text_audit.py
          python scripts/final_audit.py
          python scripts/flow_test.py
          python scripts/smoke_test.py
      - name: Commit only if everything is green
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-step83i-storage-location-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Step83i: fix storage location validation and full E2E'
          git push origin HEAD:main
