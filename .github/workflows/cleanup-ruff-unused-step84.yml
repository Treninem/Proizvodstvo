name: Step84 unused-code cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-ruff-unused-step84.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proizvodstvo-step84-unused-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install -r requirements-audit.txt
      - name: Remove only unused imports and variables
        run: ruff check app webapp --select F401,F841 --fix --unsafe-fixes
      - name: Verify F rules are clean
        run: ruff check app webapp --select F
      - name: Compile changed Python
        run: python -m compileall -q app webapp
      - name: Commit cleanup if changed
        shell: bash
        run: |
          if git diff --quiet -- app webapp; then
            echo 'No unused-code cleanup needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app webapp
          git commit -m 'Step84: remove unused imports and variables'
          git push origin HEAD:main
