name: Fix Telegram Web API Header Encoding Step83

on:
  push:
    paths:
      - '.github/workflows/fix-header-encoding-step83.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: '123456789:TEST_TOKEN_FOR_CI_ONLY'
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-step83-webtg-c'
      PUBLIC_BASE_URL: 'https://example.invalid'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Build 20260812c
        shell: bash
        run: |
          set -euo pipefail
          cp webapp/static/app-20260812b.js webapp/static/app-20260812c.js
          python - <<'PY'
          from pathlib import Path

          p=Path('webapp/static/app-20260812c.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const MINI_APP_VERSION="20260812b";','const MINI_APP_VERSION="20260812c";',1)
          old="""const deviceId=getOrCreateDeviceId();
          const devicePlatform=String(tg?.platform||navigator.userAgentData?.platform||navigator.platform||'web').slice(0,80);
          const deviceName=String(`${devicePlatform} · ${navigator.userAgentData?.mobile?'телефон':'устройство'}`).slice(0,160);
          const headers = {'Content-Type':'application/json','X-Device-Id':deviceId,'X-Device-Name':deviceName,'X-Device-Platform':devicePlatform};
          """
          new="""const deviceId=getOrCreateDeviceId();
          function safeHeaderValue(value,maxLength=160){
            return String(value||'').slice(0,maxLength).replace(/[^\\x20-\\x7E]/g,'_');
          }
          const rawDevicePlatform=String(tg?.platform||navigator.userAgentData?.platform||navigator.platform||'web');
          const devicePlatform=safeHeaderValue(rawDevicePlatform,80);
          const deviceName=safeHeaderValue(`${devicePlatform}-${navigator.userAgentData?.mobile?'mobile':'desktop'}`,160);
          const headers = {'Content-Type':'application/json','X-Device-Id':safeHeaderValue(deviceId,120),'X-Device-Name':deviceName,'X-Device-Platform':devicePlatform};
          """
          import textwrap
          old=textwrap.dedent(old)
          new=textwrap.dedent(new)
          if old not in s:
              raise SystemExit('device header block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('webapp/static/index.html')
          s=p.read_text(encoding='utf-8')
          old='/static/app-20260812b.js?v=83-webtg'
          if old not in s:
              raise SystemExit('20260812b script ref not found')
          p.write_text(s.replace(old,'/static/app-20260812c.js?v=83-webtg-headerfix',1),encoding='utf-8')

          p=Path('app/keyboards.py')
          s=p.read_text(encoding='utf-8')
          if 'MINI_UI_VERSION = "20260812b"' not in s:
              raise SystemExit('keyboards version not found')
          p.write_text(s.replace('MINI_UI_VERSION = "20260812b"','MINI_UI_VERSION = "20260812c"',1),encoding='utf-8')

          p=Path('app/handlers/owner.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Mini App 20260812b','Mini App 20260812c')
          s=s.replace('Mini App: 20260812b','Mini App: 20260812c')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'safeHeaderValue' webapp/static/app-20260812c.js
          grep -q "'mobile':'desktop'" webapp/static/app-20260812c.js
          grep -q 'app-20260812c.js?v=83-webtg-headerfix' webapp/static/index.html
          grep -q 'MINI_UI_VERSION = "20260812c"' app/keyboards.py
          ! grep -q "телефон':'устройство" webapp/static/app-20260812c.js
          node --check webapp/static/app-20260812c.js
          python -m compileall -q app webapp scripts main.py
          python -m unittest discover -s tests -p 'test*.py' -v
          python scripts/security_audit.py
          python scripts/final_audit.py
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-header-encoding-step83.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Telegram Web API request header encoding'
          git push origin HEAD:main
