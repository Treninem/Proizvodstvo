name: Full Step83 system audit

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'webapp/**'
      - 'scripts/**'
      - 'tests/**'
      - 'main.py'
      - 'requirements.txt'
      - 'requirements-audit.txt'
      - 'runtime.defaults.env'
      - '.env.example'
      - '.github/workflows/full-system-audit-step83.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      AUDIT_REVISION: '83l-deep-runtime'
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-full-audit'
      PUBLIC_BASE_URL: 'https://example.invalid'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
      TRUSTED_HOSTS: ''
      CORS_ALLOWED_ORIGINS: ''
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - name: Set synthetic CI bot token
        shell: bash
        run: echo 'BOT_TOKEN=123456789:'"$(printf 'A%.0s' {1..30})" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-audit.txt
      - name: Compile Python
        run: python -m compileall -q app webapp scripts tests main.py
      - name: Compile static SQL against current schema
        run: python scripts/sql_schema_compile_audit.py
      - name: Ruff correctness scan
        shell: bash
        run: |
          set +e
          ruff check app webapp --select F --output-format concise | tee /tmp/ruff.txt
          if grep -E 'F821|F822|F823|F811' /tmp/ruff.txt; then exit 1; fi
          exit 0
      - name: Deep runtime API select and frontend alias audit
        run: python scripts/deep_runtime_audit_step83.py
      - name: Check active Mini App JavaScript
        shell: bash
        run: |
          set -euo pipefail
          asset=$(python - <<'PY'
          import re
          from pathlib import Path
          html=Path('webapp/static/index.html').read_text(encoding='utf-8')
          print(re.search(r'app-(20\d{6}[a-z])\.js', html).group(0))
          PY
          )
          node --check "webapp/static/$asset"
      - name: Comprehensive architecture and tenant audit
        run: python scripts/full_system_audit_step83.py
      - name: Unit regressions
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Existing QA scripts
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/*_test.py; do
            echo "===== $f ====="
            python "$f"
          done
      - name: Security and final audits
        shell: bash
        run: |
          set -euo pipefail
          python scripts/security_audit.py
          python scripts/ui_text_audit.py
          python scripts/final_audit.py
          python scripts/flow_test.py
          python scripts/smoke_test.py
      - name: Runtime configuration guard
        run: python scripts/runtime_guard_test.py
