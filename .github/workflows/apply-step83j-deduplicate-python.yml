name: Apply Step83j deduplicate Python

on:
  push:
    paths:
      - '.github/workflows/apply-step83j-deduplicate-python.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      OWNER_TELEGRAM_ID: '2097006037'
      BOT_DATA_DIR: '/tmp/proizvodstvo-step83j'
      PUBLIC_BASE_URL: 'https://example.invalid'
      MINIAPP_API_TOKEN: 'ci-only-miniapp-token-not-a-secret'
      BACKUP_ENCRYPTION_KEY: 'ci-only-backup-key-not-a-secret'
      TRUSTED_HOSTS: ''
      CORS_ALLOWED_ORIGINS: ''
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - name: Set synthetic CI bot token
        shell: bash
        run: echo 'BOT_TOKEN=123456789:'"$(printf 'A%.0s' {1..30})" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Remove only shadowed earlier top-level definitions
        shell: python
        run: |
          import ast
          from pathlib import Path

          targets=[
              Path('app/services/dashboard.py'),
              Path('app/services/reporting.py'),
              Path('app/services/repository.py'),
          ]
          removed=[]
          for path in targets:
              text=path.read_text(encoding='utf-8')
              lines=text.splitlines(keepends=True)
              tree=ast.parse(text,filename=str(path))
              groups={}
              for node in tree.body:
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef)):
                      groups.setdefault(node.name,[]).append(node)
              ranges=[]
              for name,nodes in groups.items():
                  if len(nodes)<2:
                      continue
                  # Python already executes only the last definition. Removing earlier
                  # shadowed definitions preserves runtime behavior while making future
                  # patches unambiguous.
                  for node in nodes[:-1]:
                      starts=[node.lineno]
                      starts.extend(getattr(d,'lineno',node.lineno) for d in getattr(node,'decorator_list',[]))
                      start=min(starts)-1
                      end=int(node.end_lineno)
                      ranges.append((start,end,name,node.lineno,nodes[-1].lineno))
              for start,end,name,old_line,kept_line in sorted(ranges,reverse=True):
                  del lines[start:end]
                  removed.append(f'{path}:{name}: removed line {old_line}, kept final line {kept_line}')
              path.write_text(''.join(lines),encoding='utf-8')
          print(f'REMOVED_SHADOWED={len(removed)}')
          for item in reversed(removed): print(item)
          if len(removed)!=15:
              raise SystemExit(f'expected 15 shadowed definitions, got {len(removed)}')
      - name: Verify no duplicate top-level definitions or duplicate routes remain
        shell: python
        run: |
          import ast,re
          from pathlib import Path
          py=[]; routes=[]
          for base in ('app','webapp'):
              for path in sorted(Path(base).rglob('*.py')):
                  tree=ast.parse(path.read_text(encoding='utf-8'),filename=str(path))
                  seen={}; route_seen={}
                  for node in tree.body:
                      if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef)):
                          if node.name in seen: py.append((str(path),node.name,seen[node.name],node.lineno))
                          else: seen[node.name]=node.lineno
                      if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                          for dec in node.decorator_list:
                              if isinstance(dec,ast.Call) and isinstance(dec.func,ast.Attribute) and dec.args and isinstance(dec.args[0],ast.Constant):
                                  method=dec.func.attr.upper(); route=str(dec.args[0].value)
                                  if method in {'GET','POST','PUT','PATCH','DELETE'}:
                                      key=(method,route)
                                      if key in route_seen: routes.append((str(path),key,route_seen[key],node.lineno))
                                      else: route_seen[key]=node.lineno
          html=Path('webapp/static/index.html').read_text(encoding='utf-8')
          version=re.search(r'app-(20\d{6}[a-z])\.js',html).group(1)
          js=Path(f'webapp/static/app-{version}.js').read_text(encoding='utf-8')
          seen={}; jsdup=[]
          for m in re.finditer(r'(?m)^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',js):
              name=m.group(1); line=js.count('\n',0,m.start())+1
              if name in seen: jsdup.append((name,seen[name],line))
              else: seen[name]=line
          print('PY_DUPLICATES',py)
          print('ROUTE_DUPLICATES',routes)
          print('JS_DUPLICATES',jsdup)
          if py or routes or jsdup: raise SystemExit('duplicates remain')
      - name: Compile Python and static SQL
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app webapp scripts tests main.py
          python scripts/sql_schema_compile_audit.py
      - name: Comprehensive architecture and tenant audit
        run: python scripts/full_system_audit_step83.py
      - name: All unit regressions including full Mini App E2E
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Existing QA and security
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/*_test.py; do python "$f"; done
          python scripts/security_audit.py
          python scripts/ui_text_audit.py
          python scripts/final_audit.py
          python scripts/flow_test.py
          python scripts/smoke_test.py
          python scripts/runtime_guard_test.py
      - name: Make duplicate-definition audit permanent
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/full_system_audit_step83.py')
          text=p.read_text(encoding='utf-8')
          marker='def audit_repository_hygiene() -> None:\n'
          if marker not in text: raise SystemExit('audit insertion marker missing')
          block='''def audit_shadowed_definitions() -> None:\n    import ast\n    duplicates = []\n    route_duplicates = []\n    for base in (ROOT / "app", ROOT / "webapp"):\n        for path in sorted(base.rglob("*.py")):\n            tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))\n            seen = {}\n            routes = {}\n            for node in tree.body:\n                if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):\n                    if node.name in seen:\n                        duplicates.append(f"{path.relative_to(ROOT)}:{node.name}:{seen[node.name]}->{node.lineno}")\n                    else:\n                        seen[node.name] = node.lineno\n                if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):\n                    for dec in node.decorator_list:\n                        if isinstance(dec, ast.Call) and isinstance(dec.func, ast.Attribute) and dec.args and isinstance(dec.args[0], ast.Constant):\n                            method = dec.func.attr.upper()\n                            route = str(dec.args[0].value)\n                            if method in {"GET", "POST", "PUT", "PATCH", "DELETE"}:\n                                key = (method, route)\n                                if key in routes:\n                                    route_duplicates.append(f"{path.relative_to(ROOT)}:{method} {route}:{routes[key]}->{node.lineno}")\n                                else:\n                                    routes[key] = node.lineno\n    check(not duplicates, "Shadowed Python definitions: " + "; ".join(duplicates))\n    check(not route_duplicates, "Duplicate API routes: " + "; ".join(route_duplicates))\n    print("SHADOWED_DEFINITIONS_OK")\n\n\n'''
          text=text.replace(marker,block+marker,1)
          old='''        audit_sql_join_tenant_hardening,\n        audit_repository_hygiene,\n'''
          new='''        audit_sql_join_tenant_hardening,\n        audit_shadowed_definitions,\n        audit_repository_hygiene,\n'''
          if old not in text: raise SystemExit('audit list marker missing')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
      - name: Re-run full permanent audit after installing guard
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app webapp scripts tests main.py
          python scripts/full_system_audit_step83.py
          python -m unittest discover -s tests -p 'test*.py' -v
      - name: Commit only after every check is green
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-step83j-deduplicate-python.yml
          rm -f .github/workflows/audit-duplicate-definitions-step83.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Step83j: remove shadowed definitions and prevent recurrence'
          git push origin HEAD:main
